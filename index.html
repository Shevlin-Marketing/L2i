/* ============================================================
   SCREENSHOT IMPORT — on-device OCR (Tesseract), nothing uploaded.
   Profile screenshots → one lead; follower/search list screenshots
   → one lead per row. Everything is reviewed before saving.
   ============================================================ */
const TESSERACT_SRC = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let IMPORT = null;

function loadScript(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[src="${src}"]`)) return resolve();
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = ()=>reject(new Error("Couldn't load the text reader — check your connection."));
    document.head.appendChild(s);
  });
}

const OCR_UI = /^(follow back|following|follow|message|edit profile|share profile|contact|email|call|directions|subscribe|book now|order|view shop|professional dashboard|see translation|more|suggested for you|suggested|reels|tagged|threads|highlights|new|connect|pending|open to|add section|visit my website|search|see all|remove|requested|mutual|followers|posts|sort by|default|categories|meta verified|about this account|view profile|active now|active today|active yesterday|active \d|seen|delivered|sent|reply|send message|type a message|write a message|imessage|you follow each other|you both follow|you don't follow|accept|block|report)\b/i;
const OCR_BUTTONS = /\s+(follow back|following|follow|remove|message|requested|connect)\s*$/i;
const STAT_WORDS = /\b(posts?|followers?|following|likes|connections?)\b/i;
const NUM_ONLY = /^[\d.,kKmM\s]+$/;

function ocrLines(text){
  return String(text||"").split(/\r?\n/)
    .map(s=>s.replace(/[©®™“”"]+/g," ").replace(/\s+/g," ").trim())
    .filter(s=>s.length > 1 && !/^(\d{1,2}[:.]\d{2}|5G|4G|LTE|SOS|\d{1,3}%)(\s|$)/i.test(s));
}
// The top bar of a profile: "< handle" followed by a verified tick, a bell and a menu, which the
// text reader turns into stray characters. Pick the handle out token by token instead of trusting the whole line.
function barHandle(line){
  const toks = String(line||"").replace(OCR_BUTTONS,"").replace(/^[<‹«\s]+/,"").split(/\s+/).map(t=>t.replace(/^@/,"").replace(/[.,]+$/,"")).filter(Boolean);
  let best = null;
  toks.forEach((c, i)=>{
    if(!/^[a-z0-9._]{3,30}$/.test(c) || !/[a-z]/.test(c) || OCR_UI.test(c) || /^\d+[.,]?\d*[km]?$/.test(c)) return;
    const distinctive = /[._\d]/.test(c) || c.length >= 6;
    if(!distinctive && toks.length > 1) return;              // "eee", "an": icon noise next to the real handle
    const sc = c.length + (/[._\d]/.test(c) ? 4 : 0) - i;    // the handle comes first in the bar
    if(!best || sc > best.sc) best = { h:c, sc };
  });
  return best ? best.h : null;
}
function ocrHandle(line){
  const at = line.match(/@([A-Za-z0-9._]{2,30})/);
  if(at && !/\.(com|co|uk|io)$/i.test(at[1])) return at[1].replace(/\.+$/,"").toLowerCase();
  let t = line.replace(OCR_BUTTONS,"").replace(/^[<‹«\s]+/,"").trim();
  const parts = t.split(" ");
  if(parts.length > 1 && parts.slice(1).join("").length <= 3) t = parts[0];
  if(/^[a-z0-9._]{3,30}$/.test(t) && /[a-z]/.test(t) && !OCR_UI.test(t) && !/^\d+[.,]?\d*[km]?$/.test(t)) return t.replace(/\.+$/,"");
  return null;
}

/* ---- Is this line a person's name? ----
   Scores a line as a name. 0 means "not a name" (a bio line, a job title, a category, a sentence).
   The display name on a profile sits in a fixed place, so only those places are ever tested —
   a bio line further down is never promoted to the name, and the field is left blank instead. */
const NAME_PARTICLES = new Set(["de","da","di","du","del","della","van","von","der","den","la","le","el","al","bin","ibn","ben","st","dos","das","y"]);
const NOT_NAME = /\b(founder|co-?founder|ceo|cfo|coo|cto|md|director|owner|chairman|president|partner|entrepreneur|investor|investing|investments?|coach|coaching|mentor|speaker|author|creator|consultant|consulting|agency|studio|studios|ltd|limited|llc|inc|plc|group|holdings|property|properties|developments?|construction|builders?|marketing|media|digital|official|business|company|services|solutions|fitness|training|academy|club|shop|store|brand|brands|podcast|public|figure|personal|blog|blogger|athlete|artist|musician|photographer|videographer|filmmaker|producer|realtor|estate|agent|helping|building|scaling|growing|sharing|follow|link|bio|est|since|based|worldwide|global|years?|clients?|team|community|page|account|enquiries|bookings|events?|travel|food|lifestyle|fashion|beauty|health|wellness|finance|crypto|trading|sales|ecommerce|tech|software|design|designer|engineer|developer|product|education|charity|foundation|verified|professional|dashboard|highlights|message|contact|email|website|dream|hustle|mindset|success|motivation|life|love|live|work|money|wealth|free|daily|best|real|home|homes|cars?|luxury)\b/i;
const NAME_STOPWORDS = new Set(["the","and","for","with","your","you","my","our","of","to","in","on","at","from","that","this","is","are","we","by","into","who","how","what","not","no","all","more","be","it","as","or","but","just","get","make","one","big","new","now","here","out","up"]);
function nameCandidate(line){
  const none = { name:"", score:0 };
  let s = String(line||"").replace(/[\p{Extended_Pictographic}️‍]/gu," ").replace(OCR_BUTTONS,"");
  const segs = s.split(/\s*[|•·—–:\/]\s*|\s+-\s+|\s*,\s*/);                  // "Jane Okafor | Brand Coach" → "Jane Okafor"
  const rest = segs.slice(1).join(" ").replace(/\s+/g," ").trim();
  s = segs[0];
  s = s.replace(/\s+/g," ").replace(/^[^\p{L}]+|[^\p{L}.']+$/gu,"").replace(/\s+\p{Ll}\.?$/u,"").replace(/\s*\.$/,"").trim();
  if(/^\p{L} \p{Lu}\p{Ll}+ \p{Lu}\p{Ll}+/u.test(s)) s = s.slice(2);            // stray letter read off the profile photo
  if(!s || s.length < 3 || /[\d@#_=+<>()\[\]{}!?%£$€&*]/.test(s)) return none;
  if(OCR_UI.test(s) || STAT_WORDS.test(s) || NOT_NAME.test(s) || PLACE_RE.test(s)) return none;
  const words = s.split(" ");
  if(words.length > 5) return none;
  let score = (words.length === 2 || words.length === 3) ? 3 : 1, real = 0;
  for(const w of words){
    const lw = w.toLowerCase().replace(/\.$/,"");
    if(/^\p{Lu}\.?$/u.test(w)) continue;                                   // an initial
    if(NAME_PARTICLES.has(lw)) continue;
    if(NAME_STOPWORDS.has(lw)) return none;                                // "Building Brands That Last"
    if(/^\p{Lu}\p{Ll}+(['’-]\p{L}\p{Ll}*)*$/u.test(w) || /^(Mc|Mac|O['’])\p{Lu}\p{Ll}+$/u.test(w)){ score += 1; real++; continue; }
    if(/^\p{Lu}{2,}$/u.test(w) && words.length >= 2){ real++; continue; }   // ALL CAPS name, weaker
    return none;                                                           // lower-case or odd word
  }
  return real ? { name:s, score, rest } : none;
}
function nameMatchesHandle(name, handle){
  const h = String(handle||"").toLowerCase().replace(/[^a-z]/g,"");
  return !!h && String(name||"").toLowerCase().split(/\s+/).some(w=>w.length >= 3 && h.includes(w.replace(/[^a-z]/g,"")));
}
function blankImportRow(o){
  return Object.assign({name:"", organisation:"", contact_platform:"instagram", contact_handle:"", contact_phone:"", contact_email:"",
                        mutual_name:"", notes:"", source_detail:"", stage:"new", call_date:"", permission_status:"not_asked",
                        _status:"unchecked", _detail:"", _shots:[], _nameCheck:false, _handleCheck:false, _signals:[]}, o||{});
}

/* ---- What kind of screenshot is this? ---- */
// Bubbles hugging the left and right edges, with no profile counts anywhere: a chat, even with no "Seen" or typing bar in view
function looksLikeChat(objs, W, H){
  if(!objs || !objs.length) return false;
  const body = objs.filter(o=>o.y0 > H * 0.14 && o.y0 < H * 0.9 && String(o.text||"").trim().length > 2);
  if(body.some(o=>STAT_WORDS.test(o.text))) return false;
  const usable = body.filter(o=>!OCR_UI.test(String(o.text).trim()) && !OCR_BUTTONS.test(" " + String(o.text).trim()));
  if(usable.filter(o=>ocrHandle(String(o.text).trim())).length >= 3) return false;          // a followers list
  const left = usable.filter(o=>o.x0 < W * 0.2 && o.x1 < W * 0.82).length;
  const right = usable.filter(o=>o.x1 > W * 0.78 && o.x0 > W * 0.22).length;
  return right >= 1 && left + right >= 2 && (left + right) / Math.max(1, usable.length) >= 0.6;
}
function classifyShot(lines, objs, W, H){
  const all = lines.join("\n");
  let msg = 0, prof = 0;
  if(lines.slice(-8).some(l=>/\bmessage\s*(\.\.\.|…)|^\W*(imessage|type a message|write a message|send a message|text message)\b/i.test(l))) msg += 3;
  if(/\bview profile\b/i.test(all)) msg += 2;
  if(/(^|\n)\W*(seen|delivered|read)( just now| \d+\s?[mhdw]\b( ago)?| yesterday| today)?\W*(\n|$)/i.test(all)) msg += 2;
  if(/\bactive (now|today|yesterday|\d+\s?[mhdw])/i.test(all)) msg += 2;
  if(/you follow each other|you both follow|you don't follow|[·•]\s*instagram\b/i.test(all)) msg += 1;
  if(lines.some(l=>/^(today|yesterday|mon|tue|wed|thu|fri|sat|sun)?[a-z]*,?\s*\d{1,2}[:.]\d{2}\s*(am|pm)?$/i.test(l))) msg += 1;
  const statKinds = new Set((all.match(new RegExp(STAT_WORDS.source,"gi"))||[]).map(w=>w.toLowerCase().replace(/s$/,"")));
  if(statKinds.size >= 3) prof += 3; else if(statKinds.size === 2) prof += 1;
  if(/followed by/i.test(all)) prof += 1;
  if(/\b(reels|tagged|highlights|edit profile|share profile)\b/i.test(all)) prof += 1;
  if((msg >= 3 && msg > prof) || (msg >= 2 && prof === 0)) return "messages";
  return (prof === 0 && looksLikeChat(objs, W, H)) ? "messages" : "profile";
}

/* ---- Reading a message thread ----
   Each line's position says who wrote it: their bubbles sit on the left, ours on the right, and the
   name, handle and timestamps are centred or in the top bar. From that the importer works out how far
   the conversation has got, so the lead lands at the right stage instead of "new". */
function phoneIn(text){
  const cands = String(text||"").match(/\+?\d[\d\s().-]{8,17}\d/g) || [];
  for(const c of cands){
    const digits = c.replace(/\D/g,"");
    if(digits.length >= 10 && digits.length <= 13 && /^(0|44|\+|00)/.test(c.trim().replace(/[\s(]/g,""))) return c.trim();
  }
  return "";
}
/* ---- Dates in a conversation ----
   "Tomorrow", "Thursday" and "at 2" only mean something relative to when the message was sent, so each message
   is dated from the chat's own date markers ("Today 14:32", "Yesterday", "Mon 09:10", "5 Nov 14:32"). Without a
   marker the date is worked out from today and flagged for the user to confirm; it is never saved unconfirmed. */
const MONTHS3 = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const DAYS3 = ["sun","mon","tue","wed","thu","fri","sat"];
const DAY_RX = "(mon|tue|wed|thu|fri|sat|sun)(?:day|s|sday|nesday|rs|rsday|r|urday)?";
const MON_RX = "(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*";
function readClock(str){                                   // "14:32", "2:32 pm", "2pm"
  const m = String(str||"").match(/\b(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?\b/i);
  if(!m || (!m[2] && !m[3])) return null;
  let h = +m[1], mi = +(m[2]||0);
  if(m[3]){ if(h < 1 || h > 12) return null; h = (h % 12) + (m[3].toLowerCase() === "pm" ? 12 : 0); }
  return (h > 23 || mi > 59) ? null : { h, mi };
}
// A chat's date marker, as the whole line. Returns the moment it stands for, or null.
function parseStamp(text, now){
  now = now || new Date();
  const t = String(text||"").toLowerCase().replace(/[,•·]/g," ").replace(/\bat\b/g," ").replace(/\s+/g," ").trim();
  if(!t || t.length > 32) return null;
  const clockOnly = /^\d{1,2}[:.]\d{2}(\s?(am|pm))?$/;
  const base = new Date(now); base.setSeconds(0, 0);
  let d = null, rest = t, m;
  if((m = t.match(/^(today|yesterday)\b\s*(.*)$/))){ d = new Date(base); if(m[1] === "yesterday") d.setDate(d.getDate() - 1); rest = m[2]; }
  else if((m = t.match(new RegExp("^(?:" + DAY_RX + "\\s+)?(\\d{1,2})(?:st|nd|rd|th)?\\s+" + MON_RX + "(?:\\s+(\\d{4}))?\\b\\s*(.*)$")))){
    d = new Date(base); d.setMonth(MONTHS3.indexOf(m[3].slice(0,3)), +m[2]); if(m[4]) d.setFullYear(+m[4]); else if(d > now) d.setFullYear(d.getFullYear() - 1); rest = m[5];
  }
  else if((m = t.match(new RegExp("^(?:" + DAY_RX + "\\s+)?" + MON_RX + "\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:\\s+(\\d{4}))?\\b\\s*(.*)$")))){
    d = new Date(base); d.setMonth(MONTHS3.indexOf(m[2].slice(0,3)), +m[3]); if(m[4]) d.setFullYear(+m[4]); else if(d > now) d.setFullYear(d.getFullYear() - 1); rest = m[5];
  }
  else if((m = t.match(new RegExp("^" + DAY_RX + "\\b\\s*(.*)$")))){
    d = new Date(base); let back = (d.getDay() - DAYS3.indexOf(m[1]) + 7) % 7; d.setDate(d.getDate() - back); rest = m[2];
  }
  else if((m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b\s*(.*)$/))){
    d = new Date(base); const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; d.setFullYear(y, +m[2] - 1, +m[1]); rest = m[4];
  }
  else if(clockOnly.test(t)){ d = new Date(base); rest = t; }
  if(!d || isNaN(d)) return null;
  rest = rest.trim();
  if(rest && !clockOnly.test(rest)) return null;          // something else on the line: not a marker
  const c = rest ? readClock(rest) : null;
  if(c) d.setHours(c.h, c.mi, 0, 0); else d.setHours(12, 0, 0, 0);
  return d;
}
// A day and/or time someone proposed for the call, relative to when that message was sent (ref).
function parseWhen(text, ref){
  ref = ref || new Date();
  const s = " " + String(text||"").toLowerCase().replace(/[’']/g,"").replace(/\+?\d[\d\s().-]{8,17}\d/g," ") + " ";   // phone numbers out
  let h = null, mi = 0, m;
  if((m = s.match(/\b(\d{1,2})(?:[:.](\d{2}))?\s?(am|pm)\b/))){ if(+m[1] >= 1 && +m[1] <= 12){ h = (+m[1] % 12) + (m[3] === "pm" ? 12 : 0); mi = +(m[2]||0); } }
  else if((m = s.match(/\b(?:at|@|around|for|from|by)\s+([01]?\d|2[0-3])[:.]([0-5]\d)\b/))){ h = +m[1]; mi = +m[2]; }
  else if((m = s.match(/\b(?:at|@|around|for|from|by)\s+(\d{1,2})(?:\s*o\s?clock)?\b(?!\s*(?:\/|st\b|nd\b|rd\b|th\b|mins?|minutes?|hours?|hrs?|days?|people|of\b|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec))/))){
    h = +m[1]; if(h < 1 || h > 12) h = null; else if(h <= 7) h += 12;   // "at 2" in a working day means 2pm
  }
  else if((m = s.match(/\b(noon|midday)\b/))) h = 12;
  if(h === null && (m = s.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/))){ h = +m[1]; mi = +m[2]; }
  const d = new Date(ref); d.setSeconds(0, 0);
  let day = false, dm;
  if(/\b(tomorrow|tmrw|tmr|tomoz)\b/.test(s)){ d.setDate(d.getDate() + 1); day = true; }
  else if(/\b(today|tonight|this (afternoon|evening|morning)|later today)\b/.test(s)){ day = true; }
  else if((dm = s.match(new RegExp("\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?" + MON_RX)))){
    d.setMonth(MONTHS3.indexOf(dm[2].slice(0,3)), +dm[1]); if(d < startOfDay(ref)) d.setFullYear(d.getFullYear() + 1); day = true;
  }
  else if((dm = s.match(new RegExp("\\b" + MON_RX + "\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b")))){
    d.setMonth(MONTHS3.indexOf(dm[1].slice(0,3)), +dm[2]); if(d < startOfDay(ref)) d.setFullYear(d.getFullYear() + 1); day = true;
  }
  else if((dm = s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/)) && +dm[2] >= 1 && +dm[2] <= 12 && +dm[1] >= 1 && +dm[1] <= 31){
    d.setMonth(+dm[2] - 1, +dm[1]); if(dm[3]) d.setFullYear(+dm[3] < 100 ? 2000 + +dm[3] : +dm[3]); else if(d < startOfDay(ref)) d.setFullYear(d.getFullYear() + 1); day = true;
  }
  else if((dm = s.match(new RegExp("\\b(next\\s+|this\\s+)?" + DAY_RX + "\\b")))){
    let add = (DAYS3.indexOf(dm[2]) - d.getDay() + 7) % 7;
    if(add === 0) add = 7;                                   // "Thursday" said on a Thursday: next week
    d.setDate(d.getDate() + add); day = true;
    const nth = s.match(new RegExp("\\b" + DAY_RX + "\\s+(?:the\\s+(\\d{1,2})(?:st|nd|rd|th)?|(\\d{1,2})(?:st|nd|rd|th))\\b(?![:.]\\d)"));   // "Thursday 12th": trust the date
    if(nth){ const want = +(nth[2] || nth[3]); const t = new Date(ref); t.setDate(want); if(t < startOfDay(ref)) t.setMonth(t.getMonth() + 1); if(want >= 1 && want <= 31) d.setFullYear(t.getFullYear(), t.getMonth(), want); }
  }
  else if((dm = s.match(/\b(?:the\s+)(\d{1,2})(?:st|nd|rd|th)\b/))){
    const want = +dm[1]; if(want >= 1 && want <= 31){ d.setDate(want); if(d < startOfDay(ref)) d.setMonth(d.getMonth() + 1); day = true; }
  }
  if(h === null && !day) return null;
  if(h !== null) d.setHours(h, mi, 0, 0); else d.setHours(12, 0, 0, 0);
  return { date:d, hasDay:day, hasTime:h !== null };
}
function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function localDateTimeStr(d){ return localDateStr(d) + "T" + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }

function readConversation(objs, W, H){
  const conv = { name:"", handles:[], turns:[], text:"" };
  const identify = t => {                                   // who the thread is with
    const s = t.replace(/^[<‹«\s]+/,"");
    const hm = s.match(/([a-z0-9._]{3,30})\s*[·•]\s*instagram/i);
    if(hm) conv.handles.push("@" + hm[1].toLowerCase());
    else { const h = ocrHandle(s); if(h) conv.handles.push("@" + h); }
    if(!conv.name && !/^(\d{1,2}[:.]\d{2})/.test(s)){ const c = nameCandidate(s); if(c.score >= 3) conv.name = c.name; }
  };
  // A bubble's lines share a left edge, so group lines into blocks first, then decide whose each block is.
  const blocks = [];
  for(const o of objs.slice().sort((p,q)=>p.y0 - q.y0)){
    const t = String(o.text||"").replace(/[©®™“”"]+/g," ").replace(/\s+/g," ").trim();
    if(t.length < 2) continue;
    if(o.y0 < H * 0.14){ identify(t); continue; }           // top bar
    if(o.y0 > H * 0.9) continue;                            // the typing bar
    const last = blocks[blocks.length - 1];
    if(last && Math.abs(o.x0 - last.x0) < W * 0.035 && o.y0 - last.y1 < H * 0.035){ last.lines.push(t); last.x1 = Math.max(last.x1, o.x1); last.y1 = o.y1; }
    else blocks.push({ x0:o.x0, x1:o.x1, y1:o.y1, lines:[t] });
  }
  let at = null;                                                // the date of the messages that follow
  for(const b of blocks){
    const left = b.x0 / W, right = b.x1 / W, mid = (b.x0 + b.x1) / 2 / W;
    const stamp = b.lines.length <= 2 && Math.abs(mid - 0.5) < 0.2 ? parseStamp(b.lines.join(" ")) : null;
    if(stamp){ at = stamp; conv.dated = true; continue; }
    const side = left < 0.2 ? "them" : (right > 0.75 ? "me" : null);
    if(!side){ if(Math.abs(mid - 0.5) < 0.16) b.lines.forEach(identify); continue; }   // centred: name, handle
    const text = b.lines.filter(l=>!OCR_UI.test(l) && !NUM_ONLY.test(l)).join(" ")
      .replace(/^(O|0|o|Q|@)\s+(?=\S)/, "").replace(/(^|\s)\|(?=\s|$)/g, "$1I").replace(/\s+/g," ").trim();   // a letter read off their photo; "|" for "I"
    if(text.length < 2) continue;
    const clean = text.replace(/\s+(\d{1,2}[:.]\d{2}(\s?[ap]m)?)\s*(✓✓?|seen|read|delivered)?$/i, (m0, tm, ap, x, off, whole)=>{   // a sent-time printed in the bubble
      return /\b(at|for|@|around|from|by|until|til)$/i.test(whole.slice(0, off).trim()) ? m0 : "";
    }).trim();
    if(clean.length < 2) continue;
    const prev = conv.turns[conv.turns.length - 1];
    if(prev && prev.side === side && prev.at === at) prev.text += " " + clean; else conv.turns.push({ side, text:clean, at });
  }
  conv.handles = [...new Set(conv.handles)];
  conv.text = conv.turns.map(t=>(t.side === "me" ? "Us: " : "Them: ") + t.text).join("\n").slice(0, 1800);
  return conv;
}
const SAID_YES = /\b(yes|yeah|yep|yup|sure|happy to|interested|sounds (good|great|interesting)|go ahead|send (it|them|me|that|over|more)|tell me more|more (info|information|details)|love to|please do|call me|give me a (call|ring)|my number|free (on|at|tomorrow|today|this))\b/i;
const SAID_NO = /\b(not interested|no thanks|no thank you|stop messaging|remove me|don'?t (message|contact)|leave me alone|unsubscribe|not for me)\b/i;
const CALL_TALK = /\b(call|ring|speak|chat|zoom|facetime|meet|meeting|catch up|phone|free|available|suit|works for you|good time|book|diary|slot)\b/i;
const AGREED = /\b(booked|book(ed)? (it |that |you |me )?in|see you|speak (then|soon)|talk (then|soon)|that works|works for me|perfect|confirmed|locked in|in the diary|sounds good|great|ok|okay|yes|yeah|yep|sure|cool|fine|lovely)\b/i;
const IMPORT_STAGES = [["new","New — unworked"],["dm_opened","DM sent, no reply yet"],["replied","Replied"],["call_booked","Call booked"]];
function stageRank(s){ return LEAD_STAGES.findIndex(x=>x[0]===s); }
function inferConversation(turns){
  const me = turns.filter(t=>t.side==="me").map(t=>t.text).join(" "), them = turns.filter(t=>t.side==="them").map(t=>t.text).join(" ");
  const all = turns.map(t=>t.text).join(" ");
  const r = { stage:"new", permission:"not_asked", phone:"", callDate:null, callCheck:false, declined:false, signals:[] };
  if(me){ r.stage = "dm_opened"; r.permission = "asked"; r.signals.push("we messaged"); }
  if(them){ r.stage = "replied"; r.permission = "asked"; r.signals.push("they replied"); }
  r.phone = phoneIn(them);
  if(r.phone) r.signals.push("gave their number");
  if(SAID_NO.test(them)){ r.declined = true; r.signals.push("looks like a no — check before saving"); return r; }
  if(them && (SAID_YES.test(them) || r.phone)) r.permission = "granted";
  if(them && CALL_TALK.test(all)){
    // the time that stuck is the last one anyone proposed, read relative to the day that message was sent
    let found = null;
    for(let i = turns.length - 1; i >= 0 && !found; i--){
      const ref = turns[i].at || null, w = parseWhen(turns[i].text, ref || new Date());
      if(w) found = { w, i, ref };
    }
    const sameTime = (t)=>{ const w = parseWhen(t.text, t.at || new Date()); return w && found && w.date.getTime() === found.w.date.getTime(); };
    const agreedAfter = found && (turns[found.i].side === "them"                                   // they proposed it
      || turns.slice(found.i + 1).some(t=>t.side === "them" && AGREED.test(t.text))              // they agreed to ours
      || turns.slice(0, found.i).some(t=>t.side === "them" && sameTime(t)));                     // we confirmed theirs
    if(found && agreedAfter){
      const { w, ref } = found, why = [];
      if(!w.hasDay && !ref){ r.signals.push("a call time was agreed but not the day — set Call booked and pick the date"); return r; }
      if(!w.hasDay) why.push("day not said, taken as the day of that message");
      if(!w.hasTime) why.push("time not said");
      if(!ref) why.push("no date on the messages, worked out from today");
      r.stage = "call_booked"; r.permission = "granted"; r.callDate = w.date; r.callCheck = why.length > 0; r.callWhy = why;
      r.callHasTime = w.hasTime;
      r.signals.push("call " + w.date.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}) + (w.hasTime ? " " + w.date.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) : "") + (why.length ? " — confirm it (" + why.join("; ") + ")" : ""));
    } else if(found) r.signals.push("a call time was suggested but they haven't agreed yet");
    else r.signals.push("a call is mentioned — set the stage if it's booked");
  }
  return r;
}
function applyConversation(row){
  const turns = row._shots.filter(s=>s.kind==="messages" && s.turns).flatMap(s=>s.turns);
  if(!turns.length){ row._signals = []; return; }
  const r = inferConversation(turns);
  row._signals = r.signals; row._declined = r.declined;
  if(!row._stageEdited){
    row.stage = r.stage; row.permission_status = r.permission;
    row.call_date = r.callDate ? (r.callHasTime ? localDateTimeStr(r.callDate) : localDateStr(r.callDate) + "T12:00") : "";
    row._callCheck = !!(r.callDate && r.callCheck);
  }
  if(r.phone && !row.contact_phone) row.contact_phone = r.phone;
}

function parseMessagesText(lines){
  const out = { name:"", handle:"", text:"" };
  let headEnd = 0;
  for(let i=0; i<Math.min(lines.length, 6); i++){
    const l = lines[i].replace(/^[<‹«\s]+/,"");
    if(!out.handle){ const h = ocrHandle(l); if(h){ out.handle = "@"+h; headEnd = i+1; continue; } }
    if(!out.name){ const c = nameCandidate(l); if(c.score >= 3){ out.name = c.name; headEnd = i+1; continue; } }
    if(/^active\b|instagram|followers|view profile|you follow/i.test(l)) headEnd = i+1;
  }
  const body = lines.slice(headEnd).filter(l=>{
    if(OCR_UI.test(l) || NUM_ONLY.test(l)) return false;
    if(/^(message(\.\.\.|…)?|imessage|type a message|aa|gif|\+)$/i.test(l)) return false;
    if(/instagram$|followers\s*[·•]|\bposts$/i.test(l)) return false;
    if(out.handle && ocrHandle(l) === out.handle.slice(1)) return false;
    if(out.name && l === out.name) return false;
    return l.length > 1;
  });
  out.text = body.join("\n").slice(0, 1500);
  return out;
}

function parseListText(lines, platform){
  const rows = [], seen = new Set();
  for(let i=0; i<lines.length; i++){
    const h = ocrHandle(lines[i]);
    if(!h || seen.has(h)) continue;
    const c = nameCandidate(lines[i+1] || "");
    let name = "";
    if(c.score && !ocrHandle(lines[i+1])){ name = c.name; i++; }
    seen.add(h);
    rows.push(blankImportRow({contact_handle:"@"+h, name, contact_platform:platform, _nameCheck:!name}));
  }
  return rows;
}

/* ---- Sort the bio into the right fields ---- */
const ROLE_RE = /\b(co-?founder|founder|ceo|managing director|md|director|owner|chairman|president|partner|head of [a-z ]+)\b\s*(?:of|at|@|-|–|\||,|&)?\s*@?([A-Z0-9][\w&.'’ -]{1,40})?/i;
const EMAIL_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z]{2,})+/;
const PHONE_RE = /(?:\+44\s?\(?0?\)?\s?|\b0)(?:\d[\s-]?){9,10}\b/;
const WEB_RE = /\b((?:https?:\/\/)?(?:www\.)?(?!instagram\.|tiktok\.|linkedin\.)[a-z0-9-]+\.(?:co\.uk|com|io|co|uk|net|org|me|app|ai|studio|agency|london|ee)(?:\/[^\s]*)?)/i;
const PLACE_RE = /\b(london|manchester|birmingham|leeds|liverpool|bristol|glasgow|edinburgh|cardiff|belfast|essex|kent|surrey|hertfordshire|herts|cheshire|yorkshire|dubai|uk|united kingdom|england|scotland|wales|ireland|uae|usa|new york|los angeles|miami)\b/i;
const CATEGORY_RE = /^(entrepreneur|public figure|personal blog|digital creator|business service|product\/service|coach|athlete|artist|musician\/band|photographer|real estate( agent)?|consulting agency|marketing agency|community|education|blogger|video creator|content creator|investor|author|speaker|property developer|construction company|local business|company|brand|health\/beauty|fitness (trainer|model)|financial service|media( company)?|shopping & retail|restaurant|not a business)$/i;
function sortBio(bioLines, ownHandle){
  const f = { category:"", role:"", company:"", email:"", phone:"", website:"", location:"", bio:[] };
  bioLines.forEach((raw, i)=>{
    let l = raw.replace(/[\p{Extended_Pictographic}️‍]/gu," ").replace(/\s+/g," ").trim();
    if(!l) return;
    const em = l.match(EMAIL_RE); if(em && !f.email){ f.email = em[0].toLowerCase(); l = l.replace(em[0],"").trim(); }
    const ph = l.match(PHONE_RE); if(ph && !f.phone){ f.phone = ph[0].trim(); l = l.replace(ph[0],"").trim(); }
    l = l.replace(/\b(contact info|see contact info)\b/ig,"").replace(/^[\s|•·,:-]+|[\s|•·,:-]+$/g,"");
    if(!l) return;
    if(i === 0 && !f.category && CATEGORY_RE.test(l)){ f.category = l; return; }
    const pre = l.match(ROLE_RE);
    if(!pre){
      const wb = l.match(WEB_RE);
      if(wb){ if(!f.website) f.website = wb[1].replace(/[.,]$/,""); l = l.replace(wb[1],"").replace(/^[\s|•·,:-]+|[\s|•·,:-]+$/g,""); if(!l) return; }
      if(!f.location){
        const parts = l.split(/\s+[·•|–-]\s+/);
        const pi = parts.findIndex(x=>x.split(" ").length <= 4 && PLACE_RE.test(x) && !/\b(helping|building|we|i)\b/i.test(x));
        if(pi >= 0 && parts.length > 1){ f.location = parts[pi]; l = parts.filter((_,k)=>k!==pi).join(" · "); }
      }
    }
    const rm = l.match(ROLE_RE);
    if(rm && !f.role){
      f.role = rm[1].replace(/\b\w/g, c=>c.toUpperCase()).replace(/^Ceo$/,"CEO").replace(/^Md$/,"MD");
      if(rm[2]) f.company = rm[2].replace(/\s*[|•·,].*$/,"").replace(/\s+(and|&)\s*$/i,"").trim();
      const rest = l.replace(rm[0],"").replace(/^[\s|•·,:-]+|[\s|•·,:-]+$/g,"");
      if(rest.length > 3) f.bio.push(rest);
      return;
    }
    const at = l.match(/\bat\s+([A-Z][\w&.'’ -]{1,40})/);
    if(at && !f.company){ f.company = at[1].replace(/\s*[|•·,].*$/,"").trim(); f.bio.push(l); return; }
    if(!f.location && l.split(" ").length <= 4 && PLACE_RE.test(l) && !/\b(helping|building|we|i)\b/i.test(l)){ f.location = l; return; }
    f.bio.push(l);
  });
  if(!f.company){
    const tag = bioLines.join(" ").replace(new RegExp(EMAIL_RE.source, "g"), " ").match(/@([A-Za-z0-9._]{3,30})/);
    if(tag && "@"+tag[1].toLowerCase() !== ownHandle) f.company = "@" + tag[1];
  }
  return f;
}
function bioNotes(f){
  const n = [];
  if(f.role && f.company) n.push("Role: " + f.role);
  if(f.category && f.showCategory) n.push("Category: " + f.category);
  if(f.location) n.push("Location: " + f.location);
  if(f.website) n.push("Website: " + f.website);
  if(f.bio.length) n.push("Bio: " + f.bio.join(" · "));
  return n.join("\n");
}

function parseProfileText(text){
  const lines = ocrLines(text);
  const all = lines.join("\n");
  const platform = /\b\d+\+? connections?\b|\b(1st|2nd|3rd)\b|linkedin/i.test(all) ? "linkedin"
                 : (/\blikes\b/i.test(all) && /\bfollowers\b/i.test(all) && !/\bposts\b/i.test(all)) ? "tiktok"
                 : "instagram";
  const statIdx = lines.findIndex(l=>(l.match(new RegExp(STAT_WORDS.source,"gi"))||[]).length >= 2);

  if(statIdx < 0 && platform !== "linkedin"){
    const list = parseListText(lines, platform);
    if(list.length) return list;
  }

  const row = blankImportRow({contact_platform:platform});
  // handle — Instagram shows it alone in the top bar; TikTok shows "@handle" under the name
  const top = statIdx >= 0 ? statIdx + 6 : Math.min(lines.length, 12);
  let handleIdx = -1;
  const loneHandle = ()=>{ for(let i=0;i<(statIdx>=0?statIdx:6) && i<lines.length;i++){ if(NUM_ONLY.test(lines[i]) || EMAIL_RE.test(lines[i])) continue; const h = barHandle(lines[i]); if(h){ row.contact_handle = "@"+h; handleIdx = i; return; } } };
  const atHandle = ()=>{ for(let i=0;i<top && i<lines.length;i++){ if(/@[A-Za-z0-9._]{2,}/.test(lines[i]) && !EMAIL_RE.test(lines[i]) && !/followed by|founder|ceo|owner|director|\bat\b/i.test(lines[i])){ const h = ocrHandle(lines[i]); if(h){ row.contact_handle = "@"+h; handleIdx = i; return; } } } };
  // On Instagram an "@name" in the bio is another account (their business, a partner), never the person's own handle:
  // if the top bar can't be read, leave the handle blank and flag it rather than save someone else's.
  if(platform === "instagram"){ loneHandle(); if(!row.contact_handle) row._handleCheck = true; }
  else if(platform === "tiktok"){ atHandle(); if(!row.contact_handle) loneHandle(); }

  // name — only the places a display name can be: just above the counts (new layout),
  // the first line under them (old layout), or the top of the screen (LinkedIn, TikTok)
  let nameIdx = -1, best = { name:"", score:0 };
  const consider = (i, bonus)=>{
    if(i < 0 || i >= lines.length || i === handleIdx || i === statIdx) return;
    const c = nameCandidate(lines[i]); if(!c.score) return;
    const sc = c.score + (bonus||0) + (nameMatchesHandle(c.name, row.contact_handle) ? 2 : 0);
    if(sc > best.score){ best = { name:c.name, score:sc, rest:c.rest }; nameIdx = i; }
  };
  if(statIdx >= 0){
    let b = statIdx - 1; while(b >= 0 && NUM_ONLY.test(lines[b])) b--;
    consider(b, 1);
    let a = statIdx + 1; while(a < lines.length && NUM_ONLY.test(lines[a])) a++;
    consider(a, 0);
    if(!best.score) for(let i=0; i<Math.min(statIdx, 3); i++) consider(i, 0);          // TikTok top bar
  } else {
    for(let i=0; i<Math.min(lines.length, 8) && best.score < 4; i++) consider(i, 0);  // LinkedIn
  }
  row.name = best.name;
  row._nameCheck = best.score < 4;

  // bio lines → fields
  const bioStart = Math.max(nameIdx, statIdx, handleIdx) + 1;
  const bio = [];
  for(let i=bioStart; i<lines.length && bio.length<7; i++){
    const l = lines[i];
    if(/followed\s*b|mutual connection/i.test(l) || OCR_UI.test(l) || STAT_WORDS.test(l)) break;
    if(((l.match(/\p{L}/gu)||[]).length / Math.max(1, l.replace(/\s/g,"").length)) < 0.6 || /_{2,}|[=+]{1}\s/.test(l)) continue;   // icon and link-button noise
    if(NUM_ONLY.test(l)) continue;
    bio.push(l);
  }
  const f = sortBio(bio, row.contact_handle);
  const tagline = best.rest && best.rest.length <= 40 ? best.rest : "";
  row.organisation = f.company || f.role || tagline || f.category || "";
  if(f.category && row.organisation !== f.category) f.showCategory = true;
  row.contact_email = f.email;
  row.contact_phone = f.phone || ((all.match(PHONE_RE)||[""])[0]).trim();
  row.notes = bioNotes(f);


  return (row.name || row.contact_handle || bio.length) ? [row] : [];
}

/* ---- Is this the same screenshot again? ----
   A 256-bit fingerprint of the picture (which of two neighbouring patches is brighter). The same screenshot
   uploaded twice, or re-saved at another size, gives almost the same fingerprint. Two different profiles share
   a layout, so the text read from them has to match as well before an image counts as a repeat. */
function imageHash(canvas){
  const W = 17, H = 16, t = document.createElement("canvas"); t.width = W; t.height = H;
  const x = t.getContext("2d", { willReadFrequently:true }); x.drawImage(canvas, 0, 0, W, H);
  const d = x.getImageData(0, 0, W, H).data; let hex = "", nib = 0, n = 0;
  for(let r=0; r<H; r++) for(let c=0; c<W-1; c++){
    nib = (nib << 1) | (d[(r*W+c)*4] > d[(r*W+c+1)*4] ? 1 : 0);
    if(++n === 4){ hex += nib.toString(16); nib = 0; n = 0; }
  }
  return hex;
}
function hashDistance(a, b){
  if(!a || !b || a.length !== b.length) return 999;
  let dist = 0;
  for(let i=0; i<a.length; i++){ let v = parseInt(a[i],16) ^ parseInt(b[i],16); while(v){ dist += v & 1; v >>= 1; } }
  return dist;
}
function textSig(lines){ return new Set(lines.map(l=>l.toLowerCase().replace(/[^a-z0-9]+/g,"")).filter(l=>l.length > 2)); }
function sigOverlap(a, b){
  if(!a.size && !b.size) return 1;
  let both = 0; a.forEach(v=>{ if(b.has(v)) both++; });
  return both / Math.max(1, a.size + b.size - both);
}
function sameShot(a, b){
  const d = hashDistance(a.hash, b.hash), o = sigOverlap(a.sig, b.sig);
  return (d <= 14 && o >= 0.7) || (d <= 40 && o >= 0.95 && a.sig.size >= 3);
}
// handles that differ by one misread character are the same account
function editDistance(a, b){
  if(Math.abs(a.length - b.length) > 1) return 2;
  const m = a.length, n = b.length; let prev = Array.from({length:n+1}, (_,j)=>j);
  for(let i=1; i<=m; i++){ const cur = [i]; for(let j=1; j<=n; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1)); prev = cur; }
  return prev[n];
}
function sameHandle(a, b){
  const x = normHandle(a), y = normHandle(b);
  if(!x || !y) return false;
  if(x === y) return true;
  const fx = x.replace(/[._]/g,""), fy = y.replace(/[._]/g,"");
  const squash = v => v.replace(/[il1|]/g,"l").replace(/[o0]/g,"o").replace(/rn/g,"m");
  if(fx === fy || squash(fx) === squash(fy)) return true;
  return Math.min(x.length, y.length) >= 7 && editDistance(x, y) <= 1;
}

function prepImage(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, 1200 / img.naturalWidth);
      const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
      // colour copy to keep on the lead (about 150–300 KB)
      const keep = document.createElement("canvas"); const ks = Math.min(1, 1000 / img.naturalWidth);
      keep.width = Math.round(img.naturalWidth * ks); keep.height = Math.round(img.naturalHeight * ks);
      keep.getContext("2d").drawImage(img, 0, 0, keep.width, keep.height);
      // grey copy for the text reader
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d", { willReadFrequently:true });
      ctx.drawImage(img, 0, 0, w, h);
      const d = ctx.getImageData(0, 0, w, h), px = d.data;
      let sum = 0;
      for(let i=0;i<px.length;i+=4){ const g = 0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2]; px[i]=px[i+1]=px[i+2]=g; sum += g; }
      const invert = (sum / (px.length/4)) < 115;   // dark-mode screenshot → flip to dark-on-light
      if(invert) for(let i=0;i<px.length;i+=4){ px[i]=px[i+1]=px[i+2]=255-px[i]; }
      ctx.putImageData(d, 0, 0);
      const t = document.createElement("canvas"); const tw = 112; t.width = tw; t.height = Math.round(h * tw / w);
      t.getContext("2d").drawImage(img, 0, 0, t.width, t.height);
      URL.revokeObjectURL(url);
      keep.toBlob(blob=>resolve({ canvas:c, thumb:t.toDataURL("image/jpeg", 0.6), blob, hash:imageHash(c) }), "image/jpeg", 0.72);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("Couldn't read " + file.name)); };
    img.src = url;
  });
}

/* ---- Screenshots kept on a lead (private storage bucket "lead-shots") ---- */
const SHOT_BUCKET = "lead-shots";
const SHOT_KINDS = { profile:"Profile", messages:"Messages", other:"Screenshot" };
async function uploadShots(leadId, shots){
  let done = 0;
  const prior = await sb.from("lead_files").select("hash").eq("lead_id", leadId);
  const have = ((prior.data)||[]).map(f=>f.hash).filter(Boolean);
  for(let k=0; k<shots.length; k++){
    const s = shots[k];
    if(!s.blob) continue;
    if(s.hash && have.some(h=>hashDistance(h, s.hash) <= 8)) continue;     // already on this lead
    if(s.hash) have.push(s.hash);
    const path = `${leadId}/${Date.now()}-${k}-${Math.random().toString(36).slice(2,7)}.jpg`;
    const up = await sb.storage.from(SHOT_BUCKET).upload(path, s.blob, { contentType:"image/jpeg", upsert:false });
    if(up.error){ toast("Couldn't upload a screenshot: " + up.error.message, true); continue; }
    const ins = await sb.from("lead_files").insert({ lead_id: leadId, path, kind: s.kind || "other", hash: s.hash || null, created_by: state.user.id });
    if(ins.error){ await sb.storage.from(SHOT_BUCKET).remove([path]); toast(ins.error.message, true); continue; }
    done++;
  }
  return done;
}
/* ---- Notes: how the conversation went, not a transcript (the screenshots themselves are kept on the lead) ---- */
const ASKED_COST = /\b(how much|cost|costs|price|pricing|fee|fees|charge|paid|pay|invest|investment|budget|£|\$)\b/i;
const ASKED_WHAT = /\b(what (is|does|would|do)|what'?s (this|it|involved)|who (is|are)|how does|how would|tell me more|more (info|information|details?)|send (me )?(more|over|the|some|details|info)|explain|involve[sd]?)\b/i;
const NEEDS_TIME = /\b(busy|away|on holiday|next (week|month)|in a (few|couple)|get back to you|let me think|think about it|not (right )?now|later|after (christmas|the)|bad time)\b/i;
const DOUBTS = /\b(scam|legit|genuine|is this real|sounds dodgy|spam|bot)\b/i;
const KEEN = /\b(love to|would love|sounds (great|amazing|good|interesting)|interested|keen|excited|definitely|absolutely|count me in)\b/i;
function summariseConversation(turns){
  if(!turns || !turns.length) return "";
  const r = inferConversation(turns);
  const theirs = turns.filter(t=>t.side==="them"), them = theirs.map(t=>t.text).join(" ");
  const last = turns[turns.length - 1];
  const when = r.callDate ? r.callDate.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}) + (r.callHasTime ? " at " + r.callDate.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) : "") : "";
  const cost = ASKED_COST.test(them), what = ASKED_WHAT.test(them), time = NEEDS_TIME.test(them), doubt = DOUBTS.test(them), keen = KEEN.test(them);
  const questions = (them.match(/[^.?!]*\?/g)||[]).map(q=>q.trim()).filter(q=>q.length > 5).slice(0, 2);
  const straight = !cost && !what && !time && !doubt && !questions.length && theirs.length <= 2;
  const n = [];
  if(!theirs.length) n.push("First message sent. No reply yet.");
  else if(r.declined) n.push("They replied and it reads as a no.");
  else if(r.stage === "call_booked") n.push((straight ? "Straightforward booking: they replied and agreed a call" : "Call agreed after some questions") + (when ? ` for ${when}` : "") + (r.callCheck ? " (to be confirmed)" : "") + ".");
  else if(what || cost) n.push("They replied and want more information before going further.");
  else if(time) n.push("They replied but asked for more time.");
  else if(keen) n.push("They replied and sound interested. No call agreed yet.");
  else n.push("They replied. No call agreed yet.");
  if(theirs.length && !r.declined){
    const asked = [];
    if(what) asked.push("what it involves");
    if(cost) asked.push("the cost");
    if(asked.length) n.push("Asked about " + asked.join(" and ") + ".");
    if(doubt) n.push("Questioned whether it's genuine.");
    if(time && r.stage !== "call_booked") n.push("Said the timing isn't right or they need to think.");
    if(questions.length) n.push("Their question" + (questions.length > 1 ? "s" : "") + ": " + questions.map(q=>`"${q.slice(0,110)}"`).join(" "));
    if(r.phone) n.push("Gave their number: " + r.phone + ".");
    const em = them.match(EMAIL_RE); if(em) n.push("Gave their email: " + em[0].toLowerCase() + ".");
    if(keen && r.stage === "call_booked" && !straight) n.push("Tone was positive.");
  }
  if(r.stage === "call_booked") n.push("Next: confirm the call" + ((cost || what) ? " and be ready for their questions" + (cost ? " on cost" : "") : "") + ".");
  else if(r.declined) n.push("Next: check the messages, and mark as declined if that's right.");
  else if(!theirs.length) n.push("Next: one follow-up if there's no reply.");
  else if(last.side === "them") n.push("Next: they sent the last message, so a reply is due" + ((what || cost) ? ", with the information they asked for" : "") + ".");
  else n.push("Next: waiting on their reply.");
  return n.join("\n");
}
function shotMessages(row){
  const turns = row._shots.filter(s=>s.kind==="messages" && s.turns && s.turns.length).flatMap(s=>s.turns);
  if(turns.length) return `Conversation (from screenshots, ${new Date().toLocaleDateString("en-GB")}):\n` + summariseConversation(turns);
  const t = row._shots.filter(s=>s.kind==="messages" && s.text).map(s=>s.text);       // position data missing: keep what was read
  return t.length ? `Messages (screenshot ${new Date().toLocaleDateString("en-GB")}):\n` + t.join("\n") : "";
}
async function removeLeadShots(leadId){

               <select id="leadShotKind" class="shot-kind-sel"><option value="messages">Messages</option><option value="profile">Profile</option><option value="other">Other</option></select>`:""}`;

}

/* ---- Grouping: which lead does a screenshot belong to? ---- */
function nameTokens(n){ return String(n||"").toLowerCase().replace(/[^a-z\s'-]/g," ").split(/\s+/).filter(w=>w.length >= 3); }
function sameName(a, b){
  const x = nameTokens(a), y = nameTokens(b);
  if(!x.length || !y.length) return false;
  const shared = x.filter(w=>y.includes(w)).length;
  return shared >= 2 || (shared >= 1 && (x.length === 1 || y.length === 1 || x[0] === y[0]));
}
function importRowFor(name, handle, handles){
  const hs = [handle].concat(handles||[]).filter(Boolean);
  for(const h of hs){ const r = IMPORT.rows.find(x=>x.contact_handle && sameHandle(x.contact_handle, h)); if(r) return r; }
  if(name){
    const r = IMPORT.rows.find(x=>x.name && sameName(x.name, name)); if(r) return r;
    // a name that merely resembles a handle only counts when the incoming screenshot has no handle of its own to disagree
    const r2 = hs.length ? null : IMPORT.rows.find(x=>!x.name && x.contact_handle && nameMatchesHandle(name, x.contact_handle)); if(r2) return r2;
  }
  for(const h of hs){ const r = IMPORT.rows.find(x=>x.name && !x.contact_handle && nameMatchesHandle(x.name, h)); if(r) return r; }
  return null;
}
// two leads that are clearly different people: both named, nothing in common
function clearlyDifferent(row, name, handles){
  if(row.name && name && !sameName(row.name, name) && !row._nameCheck) return true;
  if(row.contact_handle && handles && handles.length && !handles.some(h=>sameHandle(h, row.contact_handle))) return !(name && row.name && sameName(row.name, name));
  return false;
}
const rowHas = (row, kind)=>row._shots.some(s=>s.kind === kind);
function mergeProfileInto(target, src){
  ["name","contact_handle","organisation","contact_phone","contact_email"].forEach(k=>{ if(!target[k] && src[k]) target[k] = src[k]; });
  if(src.contact_handle) target.contact_platform = src.contact_platform;
  if(src.notes){                                        // add only what the lead doesn't already say
    const have = new Set(target.notes.split("\n").map(l=>l.trim().toLowerCase()));
    const fresh = src.notes.split("\n").filter(l=>l.trim() && !have.has(l.trim().toLowerCase()));
    if(fresh.length) target.notes = [target.notes, fresh.join("\n")].filter(Boolean).join("\n");
  }
  if(src.name && !src._nameCheck){ target.name = src.name; target._nameCheck = false; }   // the profile's name beats one read off a message thread
  if(src.contact_handle && target.contact_handle && normHandle(src.contact_handle) === normHandle(target.contact_handle)) target._handleCheck = false;
  else if(src._handleCheck && !target.contact_handle) target._handleCheck = true;
  target._status = "unchecked"; target._detail = "";
}
function placeShot(shot, parsed, lines, target, conv){
  if(shot.kind === "messages"){
    if(!conv){ const m = parseMessagesText(lines); conv = { name:m.name, handles:m.handle?[m.handle]:[], turns:[], text:m.text }; }
    shot.text = conv.text; shot.turns = conv.turns;
  }
  if(target){                                              // "+ Screenshot" on a specific lead
    if(shot.kind !== "messages" && parsed.length === 1) mergeProfileInto(target, parsed[0]);
    target._shots.push(shot); target._status = "unchecked"; applyConversation(target);
    return 0;
  }
  if(shot.kind === "messages"){
    let row = importRowFor(conv.name, conv.handles[0], conv.handles);
    // no match by name or handle → it belongs with the profile uploaded just before it, unless that is plainly someone else
    if(!row && IMPORT.lastRow && !rowHas(IMPORT.lastRow, "messages") && !clearlyDifferent(IMPORT.lastRow, conv.name, conv.handles)) row = IMPORT.lastRow;
    if(!row){
      row = blankImportRow({ name:conv.name, contact_handle:conv.handles[0]||"", _nameCheck:true, _detail:"Messages only — add the profile screenshot" });
      IMPORT.rows.push(row); IMPORT.waiting = row;         // a profile uploaded next can claim it
    }
    if(conv.handles[0]){
      if(!row.contact_handle){ row.contact_handle = conv.handles[0]; row._handleCheck = false; }
      else if(conv.handles.some(h=>normHandle(h) === normHandle(row.contact_handle))) row._handleCheck = false;   // both screenshots agree
    }
    row._shots.push(shot); row._status = "unchecked"; applyConversation(row);
    return 0;
  }
  if(parsed.length === 1 && (parsed[0].name || parsed[0].contact_handle)){
    const p = parsed[0];
    let existing = importRowFor(p.name, p.contact_handle);
    const w = IMPORT.waiting;
    if(!existing && w && IMPORT.rows.includes(w) && !rowHas(w, "profile") && !clearlyDifferent(w, p.name, p.contact_handle ? [p.contact_handle] : [])) existing = w;
    IMPORT.waiting = null;
    if(existing){ mergeProfileInto(existing, p); existing._shots.push(shot); IMPORT.lastRow = existing; applyConversation(existing); return 0; }
    p._shots.push(shot); IMPORT.rows.push(p); IMPORT.lastRow = p; return 1;
  }
  if(parsed.length === 1 && !parsed[0].name && !parsed[0].contact_handle && IMPORT.lastRow){
    mergeProfileInto(IMPORT.lastRow, parsed[0]); IMPORT.lastRow._shots.push(shot); return 0;   // nothing to identify it → more of the profile before it
  }
  if(!parsed.length && IMPORT.lastRow){ shot.kind = "other"; IMPORT.lastRow._shots.push(shot); return 0; }
  if(!parsed.length){
    const blank = blankImportRow({ _detail:"Couldn't read this one — fill in by hand", _nameCheck:true });
    blank._shots.push(shot); IMPORT.rows.push(blank); IMPORT.lastRow = blank; return 1;
  }
  const fresh = parsed.filter(p=>!importRowFor("", p.contact_handle));   // a followers / search list: one lead per person, list image not kept
  IMPORT.rows.push(...fresh);
  return fresh.length;
}

// Message bubbles put light text on a coloured background, which the text reader skips.
// This redraws the image as "ink" wherever a pixel differs from its neighbourhood, so text of
// either polarity becomes black on white, then reads it again and merges in any new lines.
function adaptiveCanvas(canvas){
  const w = canvas.width, h = canvas.height;
  const src = canvas.getContext("2d", { willReadFrequently:true }).getImageData(0, 0, w, h);
  const g = new Uint8Array(w*h); for(let i=0, j=0; i<src.data.length; i+=4, j++) g[j] = src.data[i];
  const W = w + 1, sum = new Float64Array(W * (h + 1)), sq = new Float64Array(W * (h + 1));
  for(let y=0; y<h; y++){
    let run = 0, run2 = 0;
    for(let x=0; x<w; x++){ const v = g[y*w+x]; run += v; run2 += v*v; sum[(y+1)*W + x+1] = sum[y*W + x+1] + run; sq[(y+1)*W + x+1] = sq[y*W + x+1] + run2; }
  }
  const out = document.createElement("canvas"); out.width = w; out.height = h;
  const octx = out.getContext("2d"), od = octx.createImageData(w, h), r = Math.round(w / 40);
  for(let y=0; y<h; y++){
    const y0 = Math.max(0, y-r), y1 = Math.min(h, y+r+1);
    for(let x=0; x<w; x++){
      const x0 = Math.max(0, x-r), x1 = Math.min(w, x+r+1), n = (y1-y0)*(x1-x0);
      const mean = (sum[y1*W+x1] - sum[y0*W+x1] - sum[y1*W+x0] + sum[y0*W+x0]) / n;
      const sd = Math.sqrt(Math.max(0, (sq[y1*W+x1] - sq[y0*W+x1] - sq[y1*W+x0] + sq[y0*W+x0]) / n - mean*mean));
      // text is the minority in its neighbourhood, so it sits further from the local mean than the background does
      const v = Math.abs(g[y*w+x] - mean) > Math.max(18, 1.2 * sd) ? 0 : 255, k = (y*w+x)*4;
      od.data[k] = od.data[k+1] = od.data[k+2] = v; od.data[k+3] = 255;
    }
  }
  octx.putImageData(od, 0, 0);
  return out;
}
async function refineHandle(worker, canvas, data, row){
  const H = canvas.height, W = canvas.width;
  let changed = false;
  try{
    const bar = (data.words||[]).filter(w=>w.bbox.y0 > H*0.045 && w.bbox.y0 < H*0.14 && !/^(\d{1,2}[:.]\d{2}|5G|4G|LTE|\d{1,3}%)$/i.test(w.text.trim()))
                                .sort((a,b)=>a.bbox.x0 - b.bbox.x0);
    const run = [];
    for(const w of bar){
      const t = w.text.trim(), h = w.bbox.y1 - w.bbox.y0;
      if(!run.length){ if(/^[A-Za-z0-9._@]{2,}$/.test(t)) run.push(w); continue; }
      if(w.bbox.x0 - run[run.length-1].bbox.x1 < h * 0.9 && /^[A-Za-z0-9._]+$/.test(t)) run.push(w); else break;
    }
    if(!run.length) return;
    const x0 = Math.min(...run.map(w=>w.bbox.x0)), x1 = Math.max(...run.map(w=>w.bbox.x1)), y0 = Math.min(...run.map(w=>w.bbox.y0)), y1 = Math.max(...run.map(w=>w.bbox.y1));
    const pad = Math.round((y1 - y0) * 0.45), sx = Math.max(0, x0 - pad), sy = Math.max(0, y0 - pad), sw = Math.min(W - sx, x1 - x0 + pad*2), sh = Math.min(H - sy, y1 - y0 + pad*2);
    const c = document.createElement("canvas"); c.width = sw * 3; c.height = sh * 3;
    const cx = c.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, c.width, c.height); cx.imageSmoothingQuality = "high";
    cx.drawImage(canvas, sx, sy, sw, sh, 0, 0, c.width, c.height);
    await worker.setParameters({ tessedit_char_whitelist:"abcdefghijklmnopqrstuvwxyz0123456789._", tessedit_pageseg_mode:"7" });
    changed = true;
    const r = (await worker.recognize(c)).data;
    const second = String(r.text||"").trim().replace(/\s+/g,"").replace(/^[._]+|\.+$/g,"");
    const first = normHandle(row.contact_handle) || "";
    if(!/^[a-z0-9._]{3,30}$/.test(second) || !/[a-z]/.test(second)){ if(!first) row._handleCheck = true; return; }
    if(!first){ row.contact_handle = "@" + second; row._handleCheck = r.confidence < 80; return; }
    if(second === first){ row._handleCheck = false; return; }
    // the two reads differ: a dropped underscore or dot is the usual cause, and the focused read keeps them
    if(second.replace(/[._]/g,"") === first.replace(/[._]/g,"") || (second.includes(first) && second.length - first.length <= 12)) row.contact_handle = "@" + second;
    row._handleCheck = true;
  }catch(e){
  }finally{
    // "6" (single block) is this library's default page mode, not "3"
    if(changed) try{ await worker.setParameters({ tessedit_char_whitelist:"", tessedit_pageseg_mode:"6" }); }catch(e){}
  }
}
async function rereadInverted(worker, canvas, first){
  try{
    if(!first.lines || !first.lines.length) return null;
    const second = (await worker.recognize(adaptiveCanvas(canvas))).data;
    const a = first.lines.map(l=>({ x0:l.bbox.x0, x1:l.bbox.x1, y0:l.bbox.y0, y1:l.bbox.y1, text:l.text }));
    const extra = (second.lines||[]).filter(l=>{
      const mid = (l.bbox.y0 + l.bbox.y1) / 2, t = l.text.trim();
      return t.length > 3 && /[A-Za-z]{3}/.test(t) && l.confidence > 55 && !a.some(x=>mid >= x.y0 - 4 && mid <= x.y1 + 4);
    }).map(l=>({ x0:l.bbox.x0, x1:l.bbox.x1, y0:l.bbox.y0, y1:l.bbox.y1, text:l.text }));
    return a.concat(extra).sort((p,q)=>p.y0 - q.y0);
  }catch(e){ return null; }
}

async function runImportOcr(files, target){
  if(!files.length || IMPORT.busy) return;
  IMPORT.busy = true;
  const wrap = document.getElementById("impProgressWrap"), bar = document.getElementById("impBar"), status = document.getElementById("impStatus");
  wrap.style.display = "block";
  const setP = (pct, msg)=>{ bar.style.width = pct + "%"; status.textContent = msg; };
  let worker = null;
  try{
    setP(3, "Loading text reader…");
    await loadScript(TESSERACT_SRC);
    let current = 0;
    worker = await Tesseract.createWorker("eng", 1, {
      logger: m=>{ if(m.status === "recognizing text") setP(Math.round(((current + m.progress) / files.length) * 100), `Reading ${current+1} of ${files.length}…`); }
    });
    const stamp = new Date().toLocaleDateString("en-GB");
    for(current=0; current<files.length; current++){
      try{
        const { canvas, thumb, blob, hash } = await prepImage(files[current]);
        const { data } = await worker.recognize(canvas);
        let lines = ocrLines(data.text);
        const kind = classifyShot(lines, (data.lines||[]).map(l=>({ text:l.text, x0:l.bbox.x0, x1:l.bbox.x1, y0:l.bbox.y0, y1:l.bbox.y1 })), canvas.width, canvas.height);
        let conv = null;
        if(kind === "messages"){                       // sent bubbles are light-on-colour: read a second time and merge
          const both = await rereadInverted(worker, canvas, data);
          if(both){ lines = ocrLines(both.map(l=>l.text).join("\n")); conv = readConversation(both, canvas.width, canvas.height); }
        }
        const print = { hash, sig: textSig(lines) };
        if(IMPORT.seen.some(p=>sameShot(p, print))){ IMPORT.repeats++; continue; }   // the same screenshot again
        IMPORT.seen.push(print);
        const parsed = kind === "messages" ? [] : parseProfileText(data.text);
        if(parsed.length === 1 && parsed[0].contact_platform === "instagram" && (parsed[0].name || parsed[0].contact_handle || parsed[0].notes)) await refineHandle(worker, canvas, data, parsed[0]);
        parsed.forEach(r=>{ r.source_detail = `Screenshot ${stamp}`; });
        placeShot({ thumb, blob, kind, text:"", hash }, parsed, lines, target, conv);
        renderImportRows();
      }catch(err){ toast(err.message, true); }
    }
    IMPORT.rows.forEach(r=>{ if(!r.source_detail) r.source_detail = `Screenshot ${stamp}`; });
    setP(100, "Checking for duplicates…");
  }catch(err){
    setP(0, err.message); toast(err.message, true);
  }finally{
    if(worker) try{ await worker.terminate(); }catch(e){}
    IMPORT.busy = false;
  }
  await checkImportRows(false);
  status.textContent = summariseImport();
}

function importPayload(rows){
  return rows.map(r=>({ name:r.name.trim(), organisation:r.organisation.trim(), contact_platform:r.contact_platform,
    contact_handle:r.contact_handle.trim(), contact_phone:r.contact_phone.trim(), contact_email:(r.contact_email||"").trim(),
    mutual_name:"", notes:[r.notes.trim(), shotMessages(r)].filter(Boolean).join("\n\n"), source_detail:r.source_detail,
    stage:r.stage || "new", permission_status: r.stage === "call_booked" ? "granted" : (r.stage === "new" ? "not_asked" : (r.permission_status === "granted" ? "granted" : "asked")),
    call_date: r.stage === "call_booked" && r.call_date ? new Date(r.call_date).toISOString() : "" }));
}

async function checkImportRows(announce){
  if(!IMPORT || !IMPORT.rows.length) return;
  const { data, error } = await sb.rpc("import_leads", { p_project: state.currentProjectId, p_rows: importPayload(IMPORT.rows), p_dry_run: true });
  if(error){ toast(error.message, true); return; }
  (data.rows||[]).forEach(r=>{ const row = IMPORT.rows[r.index]; if(row){ row._status = r.status; row._detail = r.detail || ""; row._existingId = r.existing_id || null; } });
  renderImportRows();
  if(announce) toast(summariseImport());
}

function summariseImport(){
  if(!IMPORT) return "";
  const c = s => IMPORT.rows.filter(r=>r._status===s).length;
  const shots = IMPORT.rows.reduce((n,r)=>n + r._shots.length, 0);
  const parts = [`${c("ok")} ready`];
  if(c("duplicate")) parts.push(`${c("duplicate")} already in the CRM`);
  if(c("blocked")) parts.push(`${c("blocked")} do-not-contact`);
  if(c("invalid")) parts.push(`${c("invalid")} incomplete`);
  if(c("unchecked")) parts.push(`${c("unchecked")} edited, not re-checked`);
  const check = IMPORT.rows.filter(r=>r._nameCheck && r._status !== "duplicate" && r._status !== "blocked").length;
  if(check) parts.push(`${check} name${check===1?"":"s"} to check`);
  if(shots) parts.push(`${shots} screenshot${shots===1?"":"s"}`);
  if(IMPORT.repeats) parts.push(`${IMPORT.repeats} repeated screenshot${IMPORT.repeats===1?"":"s"} skipped`);
  return parts.join(" · ");
}

function renderImportRows(){
  const el = document.getElementById("impRows");
  if(!el || !IMPORT) return;
  document.getElementById("impFooter").style.display = IMPORT.rows.length ? "flex" : "none";
  const countReady = ()=>IMPORT.rows.filter(r=>r._status==="ok" || r._status==="unchecked").length;
  const saveBtn = document.getElementById("impSave");
  const setSave = ()=>{ const n = countReady(); saveBtn.textContent = n ? `Save ${n} lead${n===1?"":"s"}` : "Nothing to save"; saveBtn.disabled = !n || IMPORT.busy; };
  setSave();
  const rowLabel = (r,i)=> (r.name || r.contact_handle || `Row ${i+1}`);
  el.innerHTML = IMPORT.rows.map((r,i)=>{
    const bad = ["duplicate","blocked","invalid"].includes(r._status);
    const chip = r._status==="ok" ? `<span class="imp-chip ok">New</span>`
               : bad ? `<span class="imp-chip bad">${esc(r._detail || r._status)}</span>`
               : `<span class="imp-chip">${esc(r._detail || "Not checked yet")}</span>`;
    const sel = IMPORT.sel && IMPORT.sel.row === i ? IMPORT.sel.shot : -1;
    const msgs = r._shots.filter(s=>s.kind==="messages" && s.text);
    return `
    <div class="imp-row ${bad?"is-dup":r._status==="ok"?"is-ok":""}" data-imp-row="${i}">
      <div class="imp-shots">
        ${r._shots.map((s,j)=>`<button type="button" class="imp-shot ${sel===j?"sel":""}" data-shot-row="${i}" data-shot="${j}"><img src="${s.thumb}" alt=""><span>${esc(SHOT_KINDS[s.kind]||"Shot")}</span></button>`).join("")}
        <button type="button" class="imp-shot-add" data-add-shot="${i}" aria-label="Add a screenshot to this lead">+</button>
      </div>
      <div class="imp-fields">
        <div class="imp-head">${chip}${r._nameCheck && !bad ? `<span class="imp-chip warn">${r.name?"Check name":"Add name"}</span>`:""}${r._handleCheck && !bad ? `<span class="imp-chip warn">${r.contact_handle?"Check handle":"Add handle"}</span>`:""}<button type="button" class="imp-x" data-imp-del="${i}" aria-label="Remove row">&times;</button></div>
        ${sel >= 0 ? `<div class="imp-shot-bar">
            <select data-shot-move="${i}"><option value="">Move screenshot to…</option>${IMPORT.rows.map((o,k)=>k===i?"":`<option value="${k}">${esc(rowLabel(o,k))}</option>`).join("")}<option value="new">A new lead</option></select>
            <button type="button" class="btn-ghost btn-sm" data-shot-remove="${i}">Remove</button>
          </div>` : ""}
        <input data-imp="${i}" data-f="name" placeholder="Full name" value="${esc(r.name)}" autocomplete="off">
        <div class="two-col">
          <select data-imp="${i}" data-f="contact_platform">${PLATFORMS.map(([k,l])=>`<option value="${k}" ${r.contact_platform===k?"selected":""}>${l}</option>`).join("")}</select>
          <input data-imp="${i}" data-f="contact_handle" placeholder="@handle" value="${esc(r.contact_handle)}" autocapitalize="off" autocomplete="off">
        </div>
        <input data-imp="${i}" data-f="organisation" placeholder="Business / role" value="${esc(r.organisation)}">
        <div class="two-col" style="grid-template-columns:1fr 1fr;">
          <input data-imp="${i}" data-f="contact_phone" type="tel" placeholder="Phone" value="${esc(r.contact_phone)}">
          <input data-imp="${i}" data-f="contact_email" type="email" placeholder="Email" value="${esc(r.contact_email||"")}" autocapitalize="off">
        </div>
        <select data-imp="${i}" data-f="stage" aria-label="Stage">${IMPORT_STAGES.map(([k,l])=>`<option value="${k}" ${r.stage===k?"selected":""}>${l}</option>`).join("")}</select>
        ${r.stage === "call_booked" ? `<input data-imp="${i}" data-f="call_date" type="datetime-local" class="${r._callCheck || !r.call_date ? "needs-check" : ""}" value="${esc(r.call_date||"")}" aria-label="Call date and time">
          ${r._callCheck ? `<button type="button" class="btn-ghost btn-sm" data-call-ok="${i}" style="margin:-2px 0 6px;">Date and time are right</button>` : ""}` : ""}
        ${r._signals && r._signals.length ? `<div class="imp-msg ${r._declined?"warn":""}"><b>From the messages:</b> ${esc(r._signals.join(" · "))}</div>` : ""}
        <textarea data-imp="${i}" data-f="notes" rows="2" placeholder="Bio / notes">${esc(r.notes)}</textarea>
        ${msgs.length ? `<div class="imp-msg"><b>Conversation note</b> — added to the notes when saved<br>${esc(shotMessages(r).split("\n").slice(1).join("\n")).replace(/\n/g,"<br>")}</div>` : ""}
        ${r._status==="duplicate" && r._existingId && r._shots.length ? `<button type="button" class="btn-ghost btn-sm" data-attach-existing="${i}" style="margin-top:6px;">Add ${r._shots.length} screenshot${r._shots.length===1?"":"s"} to the existing lead${r.stage!=="new"?" and update its stage":""}</button>` : ""}
      </div>
    </div>`;
  }).join("");
  el.querySelectorAll("[data-imp]").forEach(inp=>{
    const ev = inp.tagName === "SELECT" ? "change" : "input";
    inp.addEventListener(ev, ()=>{
      const row = IMPORT.rows[+inp.dataset.imp];
      row[inp.dataset.f] = inp.value;
      if(inp.dataset.f === "name") row._nameCheck = false;
      if(inp.dataset.f === "contact_handle") row._handleCheck = false;
      if(inp.dataset.f === "stage"){ row._stageEdited = true; if(row.stage !== "call_booked") row.call_date = ""; renderImportRows(); return; }
      if(inp.dataset.f === "call_date"){ row._stageEdited = true; row._callCheck = false; return; }
      if(["name","contact_handle","contact_phone","contact_platform","organisation"].includes(inp.dataset.f) && row._status !== "unchecked"){
        row._status = "unchecked"; row._detail = "Edited — re-check";
        const card = inp.closest(".imp-row");
        card.className = "imp-row";
        card.querySelector(".imp-head .imp-chip").outerHTML = `<span class="imp-chip">Edited — re-check</span>`;
        setSave();
      }
    });
  });
  el.querySelectorAll("[data-call-ok]").forEach(b=>b.addEventListener("click", ()=>{
    const row = IMPORT.rows[+b.dataset.callOk]; row._callCheck = false; row._stageEdited = true; renderImportRows();
  }));
  el.querySelectorAll("[data-imp-del]").forEach(b=>b.addEventListener("click", ()=>{
    IMPORT.rows.splice(+b.dataset.impDel, 1); IMPORT.sel = null; renderImportRows();
  }));
  el.querySelectorAll("[data-shot]").forEach(b=>b.addEventListener("click", ()=>{
    const s = { row:+b.dataset.shotRow, shot:+b.dataset.shot };
    IMPORT.sel = (IMPORT.sel && IMPORT.sel.row === s.row && IMPORT.sel.shot === s.shot) ? null : s;
    renderImportRows();
  }));
  el.querySelectorAll("[data-add-shot]").forEach(b=>b.addEventListener("click", ()=>{
    IMPORT.addTo = IMPORT.rows[+b.dataset.addShot];
    document.getElementById("impRowFiles").click();
  }));
  el.querySelectorAll("[data-shot-move]").forEach(sel=>sel.addEventListener("change", ()=>{
    if(!sel.value || !IMPORT.sel) return;
    const from = IMPORT.rows[IMPORT.sel.row], shot = from._shots.splice(IMPORT.sel.shot, 1)[0];
    let to;
    if(sel.value === "new"){ to = blankImportRow({ source_detail: from.source_detail, _nameCheck:true, _detail:"Fill in the details" }); IMPORT.rows.push(to); }
    else to = IMPORT.rows[+sel.value];
    to._shots.push(shot); to._status = to._status === "ok" ? "ok" : to._status;
    IMPORT.sel = null; renderImportRows();
  }));
  el.querySelectorAll("[data-shot-remove]").forEach(b=>b.addEventListener("click", ()=>{
    if(!IMPORT.sel) return;
    IMPORT.rows[IMPORT.sel.row]._shots.splice(IMPORT.sel.shot, 1); IMPORT.sel = null; renderImportRows();
  }));
  el.querySelectorAll("[data-attach-existing]").forEach(b=>b.addEventListener("click", async ()=>{
    const row = IMPORT.rows[+b.dataset.attachExisting];
    b.disabled = true; b.textContent = "Adding…";
    const n = await uploadShots(row._existingId, row._shots);
    const msg = shotMessages(row);
    const cur = (await sb.from("leads").select("*").eq("id", row._existingId).single()).data || {};
    const upd = {}, nowIso = new Date().toISOString();
    if(msg) upd.notes = [cur.notes, msg].filter(Boolean).join("\n\n");
    if(row.contact_phone && !cur.contact_phone) upd.contact_phone = row.contact_phone;
    if(stageRank(row.stage) > stageRank(cur.stage) && !["won","lost","closed_not_interested"].includes(cur.stage)){   // forward only
      if(row.stage === "call_booked" && (!row.call_date || row._callCheck)){ toast(row.call_date ? "Confirm the call date and time first." : "Set the call date and time first.", true); b.disabled = false; b.textContent = "Add to the existing lead"; return; }
      upd.stage = row.stage; upd.last_contacted_at = nowIso;
      if(row.stage === "call_booked"){ upd.call_date = new Date(row.call_date).toISOString(); upd.permission_status = "granted"; upd.next_action_at = null; }
      else if(cur.permission_status !== "granted") upd.permission_status = row.permission_status === "granted" ? "granted" : "asked";
      if(upd.permission_status === "granted" && cur.permission_status !== "granted") upd.permission_at = nowIso;
      if(!cur.owner_id) upd.owner_id = state.user.id;
    }
    if(Object.keys(upd).length){
      upd.updated_at = nowIso;
      const u = await sb.from("leads").update(upd).eq("id", row._existingId);
      if(u.error) toast(u.error.code === "23505" ? "That phone number is already on another lead." : u.error.message, true);
    }
    logActivity("lead", row._existingId, `added ${n} screenshot${n===1?"":"s"}`, { name: row.name });
    IMPORT.rows.splice(IMPORT.rows.indexOf(row), 1); IMPORT.sel = null;
    await loadProjectData();
    if(!IMPORT.rows.length){ IMPORT = null; closeModal(); renderMain(); toast(`${n} screenshot${n===1?"":"s"} added to the existing lead.`); return; }
    renderImportRows(); toast(`${n} screenshot${n===1?"":"s"} added to the existing lead.`);
  }));
}

async function saveImportRows(){
  if(!IMPORT || IMPORT.busy) return;
  const toSave = IMPORT.rows.filter(r=>r._status==="ok" || r._status==="unchecked");
  if(!toSave.length) return;
  const noTime = toSave.find(r=>r.stage === "call_booked" && (!r.call_date || r._callCheck));
  if(noTime){ toast(`${noTime.call_date ? "Confirm" : "Set"} the call date and time for ${noTime.name || noTime.contact_handle || "the booked call"}, or change its stage.`, true); return; }
  IMPORT.busy = true;
  const btn = document.getElementById("impSave"); btn.disabled = true; btn.textContent = "Saving…";
  const { data, error } = await sb.rpc("import_leads", { p_project: state.currentProjectId, p_rows: importPayload(toSave), p_dry_run: false });
  if(error){ IMPORT.busy = false; toast(error.message, true); renderImportRows(); return; }
  const saved = new Set(); let shots = 0;
  const results = data.rows || [];
  for(let k=0; k<results.length; k++){
    const r = results[k], row = toSave[r.index];
    if(r.status === "ok"){
      saved.add(row);
      if(r.id && row._shots.length){
        btn.textContent = `Uploading screenshots… ${saved.size}/${toSave.length}`;
        shots += await uploadShots(r.id, row._shots);
      }
    } else { row._status = r.status; row._detail = r.detail || ""; row._existingId = r.existing_id || null; }
  }
  IMPORT.rows = IMPORT.rows.filter(r=>!saved.has(r)); IMPORT.busy = false; IMPORT.sel = null;
  await logActivity("lead", "batch", `imported ${data.added} leads from screenshots`, { added:data.added, screenshots:shots });
  await loadProjectData();
  const left = IMPORT.rows.length, shotMsg = shots ? ` with ${shots} screenshot${shots===1?"":"s"}` : "";
  if(!left){ IMPORT = null; closeModal(); renderMain(); toast(`${data.added} lead${data.added===1?"":"s"} saved${shotMsg}.`); return; }
  renderImportRows();
  document.getElementById("impStatus").textContent = `${data.added} saved${shotMsg} · ${left} left to review`;
  toast(`${data.added} saved. ${left} ${left===1?"row needs":"rows need"} attention.`);
}

function profileUrl(l){
  const raw = (l.contact_handle||"").trim();
  if(!raw) return null;
  if(/^https?:\/\//i.test(raw)) return raw;
  if(raw.indexOf("@") > 0) return null;                       // an email, not a profile
  if(/^[\w.-]+\.(com|co\.uk|me)\//i.test(raw)) return "https://" + raw;
  const h = normHandle(raw);
  if(!h) return null;
  switch(l.contact_platform || "instagram"){
    case "instagram": return "https://instagram.com/" + h;
    case "tiktok":    return "https://www.tiktok.com/@" + h;
    case "x":         return "https://x.com/" + h;
    case "linkedin":  return "https://www.linkedin.com/in/" + h;
    case "facebook":  return "https://facebook.com/" + h;
    default: return null;
  }

async function quickOutcome(id, kind){
  const lead = state.leads.find(l=>l.id===id);
  if(!lead) return;
  const nowIso = new Date().toISOString();
  const inDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return localDateStr(d); };
  let upd = { updated_at: nowIso }, msg = "";
  if(kind === "sent"){
    Object.assign(upd, { permission_status:"asked", last_contacted_at: nowIso, next_action_at: inDays(FOLLOW_UP_DAYS) });
    if(lead.stage === "new") upd.stage = "dm_opened";
    msg = `Logged. Follow-up set for ${FOLLOW_UP_DAYS} days.`;
  } else if(kind === "yes"){
    Object.assign(upd, { permission_status:"granted", permission_at: nowIso, next_action_at: localDateStr() });
    if(["new","dm_opened"].includes(lead.stage)) upd.stage = "replied";
    msg = "Permission recorded — you can share details and book a call.";
  } else if(kind === "followed"){
    Object.assign(upd, { follow_ups: (lead.follow_ups||0) + 1, last_contacted_at: nowIso, next_action_at: inDays(FOLLOW_UP_GAP_DAYS) });
    msg = "Follow-up logged. That's the last one for this person.";
  } else if(kind === "noreply"){
    Object.assign(upd, { stage:"lost", next_action_at: null });
    msg = "Closed as no reply.";
  } else if(kind === "no"){
    if(!confirm(`Mark ${lead.name} as declined? They'll be blocked from contact for the whole team.`)) return;
    const r = await sb.rpc("mark_do_not_contact", { p_lead: id, p_reason: "Declined permission" });
    if(r.error){ toast(r.error.message, true); return; }
    Object.assign(upd, { stage:"lost", next_action_at: null });
  }
  const prev = {};
  Object.keys(upd).forEach(k=>{ prev[k] = lead[k] === undefined ? null : lead[k]; });
  const { error } = await sb.from("leads").update(upd).eq("id", id);
  if(error){ toast(error.message, true); return; }
  Object.assign(lead, upd);
  logActivity("lead", id, ({sent:"sent a permission message", yes:"recorded permission granted", followed:"sent a follow-up", noreply:"closed a lead as no reply", no:"recorded a decline"})[kind], {name:lead.name});
  if(kind === "no"){
    lead.do_not_contact = true; lead.permission_status = "declined"; lead.opted_out_at = nowIso;
    renderMain(); toast("Blocked from further contact."); return;
  }
  renderMain();
  toastUndo(msg, async ()=>{
    const r = await sb.from("leads").update(prev).eq("id", id);
    if(r.error){ toast(r.error.message, true); return; }
    Object.assign(lead, prev); renderMain(); toast("Undone.");
  });
}

/* ---- paste import: CSV (with or without a header row) or a JSON array ---- */
function splitCsvLine(line){
  const out = []; let cur = "", q = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(q){ if(c === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if(c === '"') q = true;
    else if(c === "," || c === "\t"){ out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function parsePastedLeads(text){
  const ALIAS = { name:"name", "full name":"name", handle:"contact_handle", username:"contact_handle", profile:"contact_handle", contact_handle:"contact_handle",
    platform:"contact_platform", contact_platform:"contact_platform", organisation:"organisation", organization:"organisation", company:"organisation", business:"organisation",
    phone:"contact_phone", contact_phone:"contact_phone",  notes:"notes", bio:"notes" };
  const ORDER = ["name","contact_handle","contact_platform","organisation","contact_phone","notes"];
  const plat = v => { const k = String(v||"").toLowerCase().trim(); const f = PLATFORMS.find(p=>p[0]===k || p[1].toLowerCase()===k); return f ? f[0] : (k==="twitter"?"x":"instagram"); };
  const finish = o => { const r = blankImportRow(o); r.contact_platform = plat(o.contact_platform); r.source_detail = "Pasted list " + new Date().toLocaleDateString("en-GB"); return r; };
  const t = String(text||"").trim();
  if(!t) return [];
  if(t[0] === "["){
    try{
      return JSON.parse(t).map(o=>{ const m = {}; Object.keys(o||{}).forEach(k=>{ const a = ALIAS[k.toLowerCase()]; if(a) m[a] = String(o[k]==null?"":o[k]); }); return finish(m); })
        .filter(r=>r.name || r.contact_handle);
    }catch(e){ return []; }
  }
  const lines = t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let cols = ORDER;
  const first = splitCsvLine(lines[0]).map(c=>c.toLowerCase());
  if(first.some(c=>ALIAS[c])){ cols = first.map(c=>ALIAS[c] || null); lines.shift(); }
  return lines.map(line=>{
    const cells = splitCsvLine(line), o = {};
    if(cells.length === 1 && /^@|^https?:\/\//i.test(cells[0])) o.contact_handle = cells[0];
    else cells.forEach((c,i)=>{ if(cols[i]) o[cols[i]] = c; });
    return finish(o);
  }).filter(r=>r.name || r.contact_handle);
}


function exportCsv(rows, filename){
  if(!rows.length){ toast("Nothing to export yet.", true); return; }
  const keys = Object.keys(rows[0]);
  const csv = [keys.join(",")].concat(
    rows.map(r=>keys.map(k=>`"${String(r[k]??"").replace(/"/g,'""')}"`).join(","))
  ).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${filename}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

  key:"s6_pitch", title:"The L2i Investment Pitch",
  lessons:[
    {title:"Pitch Structure", content:
`Regardless of the exact wording (which your Team Leader will give you — see the next lesson), every L2i outreach conversation follows the same shape:

A warm opener tied to something specific about them — never generic. A curiosity-based bridge into what L2i does, without pitching yet. A credibility transfer — Theo Johnson's TV and film background, and L2i's existing work and collaborations. The qualifying question, to confirm real interest and capacity. And finally, a soft ask to book a short call with the team once interest is genuinely confirmed.

The actual wording matters — it's been built deliberately and tested, and brand consistency matters as much as compliance with how L2i positions investment conversations. You'll be expected to use it as written, then adapt it naturally once you know it well.`},
    {title:"The Script — word for word", content:
`This is the opener L2i uses. It asks one thing: whether they're happy to hear more. Nothing about the paid arrangement is explained in detail until they say yes.

With a mutual connection:

"Hi Tom, Sarah suggested I get in touch.

I work with Theo Johnson on Built Different, his documentary series about people who've built something from nothing. Sarah thought your story might suit the series.

Taking part involves a paid commercial arrangement, rather than a standard editorial booking. It isn't right for everyone, and nothing has been offered or decided at this stage.

Would you be open to me sending more information? If not, no problem — I won't contact you again."

Without a mutual, the first lines become: "I came across your profile and thought your story might suit the series."

Why it's written this way: every line has to be true for the person reading it. Only name a mutual who actually suggested them and agreed to be mentioned. Never say they were "put forward", "shortlisted" or picked alongside others unless that literally happened. Saying up front that it's a paid arrangement means nobody books a call believing they've been cast for free — that protects them, Theo, and you. And it ends with a genuine opt-out: if they say no, mark Permission as Declined in the CRM and they're blocked from being contacted again by anyone on the team.

In the CRM, this message appears in the lead with a copy button and fills in their first name. If a genuine mutual suggested them, change the first lines by hand as shown above. The wording is still a draft until the solicitor signs it off.`},

`The script gets you in the door — what you do next is what separates a good setter from a great one.

Personalise the one variable that matters. The name is the minimum. If you can, add one genuine specific detail in your own follow-up once they reply — something real you noticed about what they've built. That turns a template into a conversation.

Don't over-send. The opener goes out once. If they don't reply, one polite follow-up a few days later is fine — never a barrage.

When they reply, slow down. The opener's job is done; now you're qualifying (interest and capacity, from the earlier lessons) and moving them toward the call. Don't paste another script at them — talk like a person.

Never promise terms or money. If they ask "what's the commercial side?", that's a great sign — but it's the closer's conversation, not yours. Your line is that the intro call is exactly where Theo's team walks through that.`}
