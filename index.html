<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>L2i Productions — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   L2i "DAILIES" THEME — token system
   ============================================================ */
:root{
  --raw-stock:#172231;
  --raw-stock-2:#1B2738;
  --slate:#1F2C3F;
  --slate-2:#25334A;
  --slate-border:#36475F;
  --tally-amber:#D4B97A;
  --tally-amber-dim:#8C7750;
  --scope-teal:#ECD2A6;
  --scope-teal-dim:#7A6B4D;
  --bone:#F2E9D8;
  --ash:#8C93A3;
  --ash-dim:#5B6275;
  --danger:#C75450;
  --good:#7FAE8C;
  --black:#000000;
  --radius:10px;
  --radius-sm:6px;
  --font-display:'Poppins', sans-serif;
  --font-body:'Inter', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--raw-stock);color:var(--bone);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
body{
  background-image:
    radial-gradient(circle at 15% 0%, rgba(217,142,43,0.05), transparent 45%),
    radial-gradient(circle at 85% 100%, rgba(79,168,157,0.05), transparent 45%);
  min-height:100vh;
}
#app{min-height:100vh;display:flex;flex-direction:column;}
a{color:var(--tally-amber);text-decoration:none;}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:0.02em;margin:0;text-transform:uppercase;}
input,select,textarea,button{font-family:var(--font-body);font-size:16px;}
input,select,textarea{
  background:var(--slate-2);border:1px solid var(--slate-border);color:var(--bone);
  border-radius:var(--radius-sm);padding:10px 12px;width:100%;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--tally-amber);}
label{display:block;font-size:12px;color:var(--ash);margin:14px 0 5px;text-transform:uppercase;letter-spacing:0.06em;}
button{
  cursor:pointer;border:none;border-radius:var(--radius-sm);padding:10px 16px;
  font-weight:600;font-size:14px;letter-spacing:0.02em;
}
.btn-primary{background:var(--black);color:var(--bone);border:1px solid var(--tally-amber);}
.btn-primary:hover{background:#161616;border-color:var(--scope-teal);}
.btn-ghost{background:transparent;color:var(--bone);border:1px solid var(--slate-border);}
.btn-ghost:hover{border-color:var(--ash);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn-sm{padding:6px 10px;font-size:12px;}
.muted{color:var(--ash);}
.mono{font-family:var(--font-mono);}

/* ---------- login ---------- */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{width:100%;max-width:360px;background:var(--slate);border:1px solid var(--slate-border);border-radius:var(--radius);padding:32px 24px;}
.login-logo{font-family:var(--font-display);font-size:30px;color:var(--bone);text-align:center;}
.login-logo span{color:var(--tally-amber);}
.login-sub{text-align:center;color:var(--ash);font-size:13px;margin-top:4px;margin-bottom:24px;}
.build-tag{text-align:center;color:var(--ash-dim);font-size:11px;margin-top:18px;font-family:var(--font-mono);}
.error-msg{color:var(--danger);font-size:13px;margin-top:10px;}

/* ---------- shell ---------- */
.topbar{
  display:flex;align-items:center;gap:14px;padding:12px 16px;
  background:var(--slate);border-bottom:1px solid var(--slate-border);
  position:sticky;top:0;z-index:20;flex-wrap:wrap;
}
.brand{font-family:var(--font-display);font-size:20px;white-space:nowrap;}
.brand span{color:var(--tally-amber);}
.project-switch{position:relative;}
.project-switch select{padding:8px 30px 8px 12px;min-width:160px;}
.spacer{flex:1;}
.role-pill{
  font-size:11px;text-transform:uppercase;letter-spacing:0.05em;
  border:1px solid var(--scope-teal-dim);color:var(--scope-teal);
  padding:4px 9px;border-radius:20px;
}
.pipeline-tabs{display:flex;gap:6px;padding:10px 16px 0;}
.pipeline-tab{
  background:transparent;border:1px solid var(--slate-border);color:var(--ash);
  padding:8px 14px;border-radius:8px 8px 0 0;font-size:13px;text-transform:uppercase;letter-spacing:0.04em;
}
.pipeline-tab.active{background:var(--slate);color:var(--bone);border-bottom-color:var(--slate);}
.sub-tabs{display:flex;gap:8px;padding:12px 16px 0;}
.sub-tab{background:transparent;border:none;color:var(--ash);padding:6px 4px;font-size:13px;border-bottom:2px solid transparent;}
.sub-tab.active{color:var(--tally-amber);border-bottom-color:var(--tally-amber);}

main{flex:1;padding:16px;max-width:1400px;margin:0 auto;width:100%;}
.board-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.board-header h2{font-size:18px;}

/* ---------- kanban ---------- */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
.column{
  background:var(--slate);border:1px solid var(--slate-border);border-radius:var(--radius);
  min-width:260px;flex:0 0 260px;scroll-snap-align:start;display:flex;flex-direction:column;max-height:calc(100vh - 230px);
}
.column-head{
  padding:12px 14px;border-bottom:1px solid var(--slate-border);
  display:flex;justify-content:space-between;align-items:center;
}
.column-title{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ash);}
.column-count{font-family:var(--font-mono);font-size:12px;color:var(--ash);}
.column-body{padding:10px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;}

.card{
  background:var(--slate-2);border:1px solid var(--slate-border);border-radius:var(--radius-sm);
  padding:12px;cursor:pointer;transition:border-color .15s;
}
.card:hover{border-color:var(--ash);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.slate-tag{font-family:var(--font-display);font-size:13px;color:var(--tally-amber);white-space:nowrap;}
.tally-dot{
  font-size:14px;line-height:1;color:var(--tally-amber);flex-shrink:0;margin-top:1px;
  animation:starpulse 1.7s infinite;
}
@keyframes starpulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:0.5;transform:scale(1.3);}
}
.card-title{font-size:14px;font-weight:600;margin-top:6px;}
.card-meta{font-size:12px;color:var(--ash);margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;}
.day-counter{font-family:var(--font-mono);color:var(--scope-teal);}
.card-value{font-family:var(--font-mono);color:var(--tally-amber);font-size:13px;margin-top:4px;}
.empty-col{color:var(--ash-dim);font-size:12px;text-align:center;padding:18px 6px;}

/* ---------- modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:flex-end;
  justify-content:center;z-index:50;
}
@media(min-width:640px){.overlay{align-items:center;}}
.modal{
  background:var(--slate);border:1px solid var(--slate-border);border-radius:var(--radius) var(--radius) 0 0;
  width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:20px;
}
@media(min-width:640px){.modal{border-radius:var(--radius);}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.modal-close{background:transparent;color:var(--ash);font-size:20px;padding:2px 8px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}

/* ---------- activity feed ---------- */
.feed{margin-top:24px;border-top:1px solid var(--slate-border);padding-top:14px;}
.feed h3{font-size:13px;color:var(--ash);letter-spacing:0.06em;margin-bottom:10px;}
.feed-item{font-size:13px;padding:7px 0;border-bottom:1px solid var(--slate-border);}
.feed-item .who{color:var(--scope-teal);}
.feed-time{color:var(--ash-dim);font-size:11px;font-family:var(--font-mono);}

/* ---------- team table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--ash);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;padding:8px 10px;border-bottom:1px solid var(--slate-border);}
td{padding:8px 10px;border-bottom:1px solid var(--slate-border);}

/* ---------- toast ---------- */
/* ---------- training (Setter Academy) ---------- */
.module-card{background:var(--slate);border:1px solid var(--slate-border);border-radius:var(--radius);padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;}
.module-card.locked{opacity:0.5;}
.module-num{font-family:var(--font-mono);color:var(--tally-amber);font-size:13px;min-width:28px;}
.module-info{flex:1;}
.module-title{font-weight:700;font-size:15px;}
.module-status{font-size:12px;color:var(--ash);margin-top:3px;}
.pass-badge{font-size:11px;color:var(--good);border:1px solid var(--good);padding:2px 8px;border-radius:20px;white-space:nowrap;}
.progress-bar-track{height:6px;background:var(--slate-2);border-radius:4px;overflow:hidden;}
.progress-bar-fill{height:100%;background:var(--tally-amber);}
.lesson-nav{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.lesson-dot{width:28px;height:28px;border-radius:50%;background:var(--slate-2);border:1px solid var(--slate-border);display:flex;align-items:center;justify-content:center;font-size:12px;font-family:var(--font-mono);color:var(--ash);}
.lesson-dot.done{background:var(--tally-amber);color:var(--black);border-color:var(--tally-amber);}
.lesson-dot.active{border-color:var(--scope-teal);color:var(--scope-teal);}
.lesson-content p{line-height:1.65;margin:0 0 14px;font-size:15px;}
.pending-box{border:1px dashed var(--tally-amber-dim);border-radius:var(--radius-sm);padding:14px;background:var(--slate-2);font-size:13px;color:var(--scope-teal);}
.pending-box p{line-height:1.6;margin:0 0 10px;}
.quiz-q{background:var(--slate);border:1px solid var(--slate-border);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.quiz-q-title{font-weight:600;margin-bottom:10px;font-size:14px;}
.quiz-opt{display:block;width:100%;text-align:left;background:var(--slate-2);border:1px solid var(--slate-border);color:var(--bone);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;font-size:14px;font-weight:400;}
.quiz-opt.selected{border-color:var(--scope-teal);}
.result-card{text-align:center;padding:30px 20px;}
.result-score{font-family:var(--font-display);font-size:48px;color:var(--tally-amber);}
.back-link{font-size:13px;color:var(--ash);margin-bottom:14px;display:inline-block;}

#toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--slate-2);border:1px solid var(--slate-border);color:var(--bone);
  padding:10px 18px;border-radius:8px;font-size:13px;z-index:100;display:none;
}
#toast.error{border-color:var(--danger);color:var(--danger);}

.empty-state{text-align:center;padding:40px 20px;color:var(--ash);}
.badge-unassigned{display:inline-block;font-size:11px;color:var(--danger);border:1px solid var(--danger);padding:2px 7px;border-radius:20px;}
</style>
</head>

const $app = document.getElementById("app");
const $toast = document.getElementById("toast");

function toast(msg, isError){
  $toast.textContent = msg;
  $toast.className = isError ? "error" : "";
  $toast.style.display = "block";
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>{ $toast.style.display="none"; }, 3200);
}

function esc(str){
  if(str===null||str===undefined) return "";
  return String(str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtMoney(n){
  if(n===null||n===undefined||n==="") return "—";
  return "£" + Number(n).toLocaleString();
}
function fmtDate(d){
  if(!d) return "—";
  return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
function daysSince(d){
  if(!d) return 0;
  const ms = new Date().setHours(0,0,0,0) - new Date(d).setHours(0,0,0,0);
  return Math.max(0, Math.round(ms / 86400000));
}
function timeAgo(d){
  const s = Math.floor((Date.now() - new Date(d).getTime())/1000);
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}
function profileName(id){
  const p = state.allProfiles.find(p=>p.id===id);
  return p ? p.full_name : "Unassigned";
}
function isRole(...roles){ return state.profile && roles.includes(state.profile.role); }
function isOwnerOrBd(){ return isRole("owner","business_development"); }
function canManageLeads(){ return isRole("owner","team_leader","business_development","setter"); }
function canManageDeals(){ return isRole("owner","team_leader","business_development","closer"); }
function isOwnerOrTeamLead(){ return isRole("owner","team_leader"); }
function canManageProductions(){ return isRole("owner","team_leader","business_development"); }

/* ============================================================
   AUTH
   ============================================================ */
async function init(){
  if(!CONFIGURED){
    renderSetupNeeded();
    return;
  }
  const { data:{ session } } = await sb.auth.getSession();
  if(session){
    state.user = session.user;
    await loadEverything();
  } else {
    state.loading = false;
    renderLogin();
  }
}

async function loadEverything(){
  const { data: profile, error: pErr } = await sb.from("profiles").select("*").eq("id", state.user.id).single();
  if(pErr || !profile){
    toast("Your profile wasn't found — try signing out and back in.", true);
    await sb.auth.signOut();
    state.user = null; state.loading=false;
    renderLogin("signin");
    return;
  }
  state.profile = profile;
  if(!profile.approved){
    state.loading = false;
    renderPendingApproval();
    return;
  }

  const [{data:allProfiles}, {data:projects}] = await Promise.all([
    sb.from("profiles").select("*").order("full_name"),
    sb.from("projects").select("*").eq("archived", false).order("created_at")
  ]);
  state.allProfiles = allProfiles || [];
  state.projects = projects || [];
  if(!state.currentProjectId && state.projects.length){
    state.currentProjectId = state.projects[0].id;
  }
  state.loading = false;
  await loadProjectData();
  renderShell();
}

async function loadProjectData(){
  if(!state.currentProjectId) return;
  const pid = state.currentProjectId;
  const [{data:leads},{data:deals},{data:productions},{data:activity},{data:stages},{data:notifications}] = await Promise.all([
    sb.from("leads").select("*").eq("project_id", pid).order("created_at",{ascending:false}),
    sb.from("deals").select("*").eq("project_id", pid).order("created_at",{ascending:false}),
    sb.from("productions").select("*").eq("project_id", pid).order("slate_number",{ascending:false}),
    sb.from("activity_log").select("*").eq("project_id", pid).order("created_at",{ascending:false}).limit(25),
    sb.from("pipeline_stages").select("*").eq("project_id", pid).order("sort_order",{ascending:true}),
    sb.from("notifications").select("*").eq("project_id", pid).order("created_at",{ascending:false}).limit(50)
  ]);
  state.leads = leads || [];
  state.deals = deals || [];
  state.productions = productions || [];
  state.activity = activity || [];
  state.stages = stages || [];
  state.notifications = notifications || [];
}

async function logActivity(entity_type, entity_id, action, details){
  await sb.from("activity_log").insert({
    project_id: state.currentProjectId, entity_type, entity_id,
    user_id: state.user.id, action, details: details || {}
  });
}

function renderLogin(mode){
  mode = mode || "signin";
  $app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <img src="data:image/png;base64,${LOGO_B64}" alt="L2i Productions" style="width:88px;height:88px;display:block;margin:0 auto 14px;border-radius:50%;">
        <div class="login-logo">L2<span>i</span> PRODUCTIONS</div>
        <div class="login-sub">CRM — ${mode==="signin"?"sign in":"create your account"}</div>
        <form id="authForm">
          ${mode==="signup"?`<label>Full name</label><input type="text" id="authName" required>`:""}
          <label>Email</label>
          <input type="email" id="authEmail" required autocomplete="username">
          <label>Password</label>
          <input type="password" id="authPassword" required autocomplete="${mode==='signin'?'current-password':'new-password'}" minlength="8">
          <button type="submit" class="btn-primary" style="width:100%;margin-top:20px;">${mode==="signin"?"Sign in":"Create account"}</button>
          <div class="error-msg" id="authError"></div>
        </form>
        <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--ash);">
          ${mode==="signin"
            ? `New here? <a href="#" id="toSignup">Create an account</a>`
            : `Already have one? <a href="#" id="toSignin">Sign in</a>`}
        </div>
        <div class="build-tag">L2i CRM — Build ${BUILD_NUMBER}</div>
      </div>
    </div>`;
  document.getElementById("authForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;
    const errEl = document.getElementById("authError");
    errEl.textContent = "";
    if(mode === "signin"){
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error){ errEl.textContent = error.message; return; }
      state.user = data.user;
      await loadEverything();
    } else {
      const fullName = document.getElementById("authName").value.trim();
      const { data, error } = await sb.auth.signUp({
        email, password, options: { data: { full_name: fullName } }
      });
      if(error){ errEl.textContent = error.message; return; }
      if(data.session){
        state.user = data.user;
        await loadEverything();
      } else {
        renderCheckEmail(email);
      }
    }
  });
  const toSignup = document.getElementById("toSignup");
  if(toSignup) toSignup.addEventListener("click", (e)=>{ e.preventDefault(); renderLogin("signup"); });
  const toSignin = document.getElementById("toSignin");
  if(toSignin) toSignin.addEventListener("click", (e)=>{ e.preventDefault(); renderLogin("signin"); });
}

        </select>
      </div>
      ${isRole("owner") ? `<button class="btn-ghost btn-sm" id="manageProjectsBtn">Manage projects</button>` : ""}
      ${isRole("owner") ? `<button class="btn-ghost btn-sm" id="teamBtn">Team</button>` : ""}
      ${isOwnerOrTeamLead() ? `<button class="btn-ghost btn-sm" id="reportBtn">Report${state.notifications.length?` (${state.notifications.length})`:""}</button>` : ""}
      <div class="spacer"></div>
      <span class="role-pill">${esc(roleLabel(state.profile.role))}</span>
      <button class="btn-ghost btn-sm" id="signOutBtn">Sign out</button>
    </div>
    <div class="pipeline-tabs">
      <button class="pipeline-tab ${state.pipeline==='acquisition'?'active':''}" data-pipeline="acquisition">Acquisition</button>
      <button class="pipeline-tab ${state.pipeline==='production'?'active':''}" data-pipeline="production">Production</button>
      <button class="pipeline-tab ${state.pipeline==='training'?'active':''}" data-pipeline="training">Training</button>
    </div>
    <main id="main"></main>
  `;
  document.getElementById("projectSelect").addEventListener("change", async (e)=>{
    state.currentProjectId = e.target.value;
    await loadProjectData();
    renderMain();
  });
  document.getElementById("signOutBtn").addEventListener("click", signOut);
  document.querySelectorAll(".pipeline-tab").forEach(b=>{
    b.addEventListener("click", ()=>{ state.pipeline = b.dataset.pipeline; renderShell(); });
  });
  if(isRole("owner")){
    document.getElementById("manageProjectsBtn").addEventListener("click", openManageProjects);
    document.getElementById("teamBtn").addEventListener("click", openTeamModal);
  }
  if(isOwnerOrTeamLead()){
    document.getElementById("reportBtn").addEventListener("click", openReportModal);
  }
  renderMain();
}

function roleLabel(r){ const f = ROLES.find(x=>x[0]===r); return f?f[1]:r; }

function renderMain(){
  const $main = document.getElementById("main");
  if(state.pipeline === "training"){
    renderTrainingHome($main);
    return;
  }
  if(!state.projects.length){
    $main.innerHTML = `<div class="empty-state">No projects yet. ${isRole("owner")?"Use \"Manage projects\" above to create one.":"Ask the owner to set one up."}</div>`;
    return;
  }
  if(state.pipeline === "acquisition"){
    $main.innerHTML = `
      <div class="sub-tabs">
        <button class="sub-tab ${state.subTab==='leads'?'active':''}" data-sub="leads">Leads</button>
        <button class="sub-tab ${state.subTab==='deals'?'active':''}" data-sub="deals">Deals</button>
      </div>
      <div id="subContent" style="margin-top:14px;"></div>
    `;
    document.querySelectorAll(".sub-tab").forEach(b=>{
      b.addEventListener("click", ()=>{ state.subTab=b.dataset.sub; renderMain(); });
    });
    renderSubContent();
  } else {
    renderProductionBoard($main);
  }
}

function renderSubContent(){
  const el = document.getElementById("subContent");
  if(state.subTab === "leads") renderLeadsBoard(el);

}

function productionCard(p){
  const stageDef = state.stages.find(s=>s.key===p.production_stage);
  const live = state.stages.length && p.production_stage === state.stages[Math.min(2,state.stages.length-1)].key;

  return `

/* ============================================================
   MODAL FRAMEWORK
   ============================================================ */
function openModal(html){
  const wrap = document.createElement("div");
  wrap.className = "overlay";
  wrap.id = "overlay";
  wrap.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener("click", (e)=>{ if(e.target.id==="overlay") closeModal(); });
}
function closeModal(){
  const o = document.getElementById("overlay");
  if(o) o.remove();
}

/* ---------- Lead modal ---------- */
function openLeadModal(id){
  const lead = id ? state.leads.find(l=>l.id===id) : null;
  const canEdit = canManageLeads();
  openModal(`
    <div class="modal-head"><h3>${lead?"Edit lead":"New lead"}</h3><button class="modal-close" id="mClose">&times;</button></div>
    <label>Name</label><input id="f_name" value="${esc(lead?.name||"")}" ${canEdit?"":"disabled"}>
    <label>Organisation</label><input id="f_org" value="${esc(lead?.organisation||"")}" ${canEdit?"":"disabled"}>
    <label>Contact email</label><input id="f_email" value="${esc(lead?.contact_email||"")}" ${canEdit?"":"disabled"}>
    <label>Source</label><input id="f_source" value="${esc(lead?.source||"")}" ${canEdit?"":"disabled"}>
    <label>Estimated value (£)</label><input id="f_value" type="number" value="${lead?.value_estimate||""}" ${canEdit?"":"disabled"}>
    <label>Stage</label>
    <select id="f_stage" ${canEdit?"":"disabled"}>${LEAD_STAGES.map(([k,l])=>`<option value="${k}" ${lead?.stage===k?"selected":""}>${l}</option>`).join("")}</select>
    <label>Owner</label>
    <select id="f_owner" ${canEdit?"":"disabled"}>${state.allProfiles.map(p=>`<option value="${p.id}" ${lead?.owner_id===p.id?"selected":""}>${esc(p.full_name)}</option>`).join("")}</select>
    <label>Notes</label><textarea id="f_notes" rows="3" ${canEdit?"":"disabled"}>${esc(lead?.notes||"")}</textarea>
    <div class="modal-actions">
      ${canEdit?`<button class="btn-primary" id="mSave">${lead?"Save":"Create"}</button>`:""}
      ${lead && canEdit && lead.stage!=="converted" ? `<button class="btn-ghost" id="mConvert">Convert to deal →</button>`:""}
      ${lead && canEdit ? `<button class="btn-danger" id="mDelete">Delete</button>`:""}
    </div>
  `);
  document.getElementById("mClose").addEventListener("click", closeModal);
  if(!canEdit) return;
  document.getElementById("mSave").addEventListener("click", async ()=>{
    const payload = {
      project_id: state.currentProjectId,
      name: document.getElementById("f_name").value.trim(),
      organisation: document.getElementById("f_org").value.trim(),
      contact_email: document.getElementById("f_email").value.trim(),
      source: document.getElementById("f_source").value.trim(),
      value_estimate: document.getElementById("f_value").value || null,
      stage: document.getElementById("f_stage").value,
      owner_id: document.getElementById("f_owner").value,
      notes: document.getElementById("f_notes").value.trim(),
      updated_at: new Date().toISOString()
    };
    if(!payload.name){ toast("Name is required.", true); return; }
    let res;
    if(lead) res = await sb.from("leads").update(payload).eq("id", lead.id);
    else res = await sb.from("leads").insert(payload);
    if(res.error){ toast(res.error.message, true); return; }
    await logActivity("lead", lead?lead.id:"new", lead?"updated a lead":"created a lead", {name:payload.name});
    closeModal(); await loadProjectData(); renderMain(); toast("Saved.");
  });
  if(lead && lead.stage!=="converted"){
    const convertBtn = document.getElementById("mConvert");
    if(convertBtn) convertBtn.addEventListener("click", async ()=>{
      const { error } = await sb.from("deals").insert({
        project_id: state.currentProjectId, lead_id: lead.id,
        name: lead.name, client_name: lead.organisation || lead.name,
        deal_value: lead.value_estimate || 0, owner_id: lead.owner_id, stage:"negotiating"
      });
      if(error){ toast(error.message, true); return; }
      await sb.from("leads").update({stage:"converted"}).eq("id", lead.id);
      await logActivity("lead", lead.id, "converted a lead to a deal", {name:lead.name});
      closeModal(); await loadProjectData(); renderMain(); toast("Converted to deal.");
    });
  }
  if(lead){
    const delBtn = document.getElementById("mDelete");
    if(delBtn) delBtn.addEventListener("click", async ()=>{
      if(!confirm("Delete this lead? This can't be undone.")) return;
      await sb.from("leads").delete().eq("id", lead.id);
      closeModal(); await loadProjectData(); renderMain(); toast("Lead deleted.");
    });
  }
}

/* ---------- Production modal ---------- */
function openProductionModal(id){
  const prod = id ? state.productions.find(p=>p.id===id) : null;
  const canEditAll = canManageProductions();
  const isAssigned = prod && [prod.closer_id, prod.setter_id].includes(state.user.id);
  const canEditSome = canEditAll || isAssigned;
  const showBudget = isRole("owner","team_leader","business_development","coach");
  openModal(`
    <div class="modal-head"><h3>${prod?"Edit production":"New production"}</h3><button class="modal-close" id="mClose">&times;</button></div>
    ${prod?`<div class="slate-tag" style="margin-bottom:10px;">SLATE №${String(prod.slate_number).padStart(3,"0")} · DAY ${daysSince(prod.stage_entered_at)}</div>`:""}
    <label>Title</label><input id="f_title" value="${esc(prod?.title||"")}" ${canEditAll?"":"disabled"}>
    <label>Client</label><input id="f_client" value="${esc(prod?.client_name||"")}" ${canEditAll?"":"disabled"}>
    ${showBudget?`<label>Budget (£)</label><input id="f_budget" type="number" value="${prod?.budget||""}" ${canEditAll?"":"disabled"}>`:""}
    <label>Stage</label>
    <select id="f_stage" ${canEditSome?"":"disabled"}>${state.stages.map(s=>`<option value="${s.key}" ${prod?.production_stage===s.key?"selected":""}>${esc(s.label)}</option>`).join("")}</select>
    <label>Target delivery date</label><input id="f_target" type="date" value="${prod?.target_delivery_date||""}" ${canEditAll?"":"disabled"}>
    <label>Closer</label>
    <select id="f_closer" ${canEditAll?"":"disabled"}><option value="">Unassigned</option>${state.allProfiles.map(p=>`<option value="${p.id}" ${prod?.closer_id===p.id?"selected":""}>${esc(p.full_name)}</option>`).join("")}</select>
    <label>Setter</label>
    <select id="f_setter" ${canEditAll?"":"disabled"}><option value="">Unassigned</option>${state.allProfiles.map(p=>`<option value="${p.id}" ${prod?.setter_id===p.id?"selected":""}>${esc(p.full_name)}</option>`).join("")}</select>
    <label>Notes</label><textarea id="f_notes" rows="3" ${canEditSome?"":"disabled"}>${esc(prod?.notes||"")}</textarea>
    <div class="modal-actions">
      ${canEditSome?`<button class="btn-primary" id="mSave">${prod?"Save":"Create"}</button>`:""}
      ${prod && canEditAll ? `<button class="btn-danger" id="mDelete">Delete</button>`:""}
    </div>
  `);
  document.getElementById("mClose").addEventListener("click", closeModal);
  if(!canEditSome) return;
  document.getElementById("mSave").addEventListener("click", async ()=>{
    if(!document.getElementById("f_stage").options.length){ toast("Set up pipeline stages for this project first.", true); return; }
    const newStage = document.getElementById("f_stage").value;
    const payload = canEditAll ? {
      project_id: state.currentProjectId,
      title: document.getElementById("f_title").value.trim(),
      client_name: document.getElementById("f_client").value.trim(),
      budget: showBudget ? (document.getElementById("f_budget").value || null) : (prod?prod.budget:null),
      production_stage: newStage,
      target_delivery_date: document.getElementById("f_target").value || null,
      closer_id: document.getElementById("f_closer").value || null,
      setter_id: document.getElementById("f_setter").value || null,
      notes: document.getElementById("f_notes").value.trim(),
      updated_at: new Date().toISOString()
    } : {
      production_stage: newStage,
      notes: document.getElementById("f_notes").value.trim(),
      updated_at: new Date().toISOString()
    };
    if(prod && newStage !== prod.production_stage){
      payload.stage_entered_at = new Date().toISOString().slice(0,10);
    }
    if(canEditAll && !payload.title){ toast("Title is required.", true); return; }
    let res;
    if(prod) res = await sb.from("productions").update(payload).eq("id", prod.id);
    else res = await sb.from("productions").insert(payload);
    if(res.error){ toast(res.error.message, true); return; }
    await logActivity("production", prod?prod.id:"new", prod?"updated a production":"created a production", {title:payload.title});
    closeModal(); await loadProjectData(); renderMain(); toast("Saved.");
  });
  if(prod && canEditAll){
    const delBtn = document.getElementById("mDelete");
    if(delBtn) delBtn.addEventListener("click", async ()=>{
      if(!confirm("Delete this production? This can't be undone.")) return;
      await sb.from("productions").delete().eq("id", prod.id);
      closeModal(); await loadProjectData(); renderMain(); toast("Production deleted.");
    });
  }
}

/* ---------- Report (booked leads + won deals, for Ayden to forward to Theo) ---------- */
function openReportModal(){
  const proj = state.projects.find(p=>p.id===state.currentProjectId);
  const grouped = {};
  state.notifications.forEach(n=>{
    const day = new Date(n.created_at).toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"short"});
    grouped[day] = grouped[day] || [];
    grouped[day].push(n);

  const days = Object.keys(grouped);
  openModal(`
    <div class="modal-head"><h3>Report — ${esc(proj?proj.name:"")}</h3><button class="modal-close" id="mClose">&times;</button></div>
    <div class="muted" style="font-size:12px;margin-bottom:10px;">Bookings and wins, newest first. Screenshot this or copy it as text to send to Theo.</div>
    <div id="reportBody">
      ${days.length ? days.map(day=>`
        <div style="margin-top:14px;">
          <div class="mono" style="font-size:11px;color:var(--ash);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">${day}</div>
          ${grouped[day].map(n=>`<div class="feed-item">${esc(n.message)}</div>`).join("")}

/* ============================================================
   CSV EXPORT
   ============================================================ */
function exportCsv(rows, filename){
  if(!rows.length){ toast("Nothing to export yet.", true); return; }
  const keys = Object.keys(rows[0]);
  const csv = [keys.join(",")].concat(
    rows.map(r=>keys.map(k=>`"${String(r[k]??"").replace(/"/g,'""')}"`).join(","))
  ).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${filename}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

Once that's added here, you'll be expected to know it well enough to use naturally in your own voice, not recite it word-for-word. Check back, or ask your Team Leader if you need it before it's added to this course.`}
  ],
  quiz:[
    {q:"What comes first in the L2i pitch structure?", options:["The qualifying question","A warm, specific opener tied to the person","Asking for a financial commitment","A generic compliment sent to everyone"], correct:1},
    {q:"What is the 'credibility transfer' step built on?", options:["The setter's own personal achievements","Theo Johnson's TV/film background and L2i's existing work","A list of competitor productions","Random statistics about the film industry"], correct:1},
    {q:"What's the final step once interest is genuinely confirmed?", options:["Ask for an immediate wire transfer","A soft ask to book a short call with the team","End the conversation immediately","Send the full investment contract"], correct:1},
    {q:"Why does the exact wording of the pitch matter?", options:["It doesn't — any wording works equally well","Brand consistency and how L2i positions investment conversations both matter","It's required by Instagram's terms of service","Because closers never see the wording"], correct:1},
    {q:"How should you eventually use the real script, once it's added to this course?", options:["Recite it word-for-word every time, no exceptions","Know it well enough to use naturally in your own voice","Ignore it and write your own version","Only use it with prospects who ask for it"], correct:1}
  ]
},
{
  key:"s7_objections", title:"Objection Handling",
  lessons:[
    {title:"The Four Objection Families", content:
`Almost every objection you'll see in a DM falls into one of four families:

Trust or skepticism — "Is this legit? Why are you messaging me?" Timing — "Not right now." Amount or capacity — "That's more than I'd put into something like this." Deflection — "Send me more info" or "I'll think about it," without any real engagement behind it.

Recognising which family you're dealing with is the first step — each one needs a different response, and treating them all the same is how good prospects get lost.`},
    {title:"A Generic Response Framework", content:
`Acknowledge, reframe, re-ask. Acknowledge the objection without arguing or getting defensive — agreeing with part of it costs you nothing and lowers their guard. Reframe by addressing what's actually underneath the objection, which is often unstated (trust objections are rarely really about you; timing objections are sometimes really about not understanding the opportunity yet). Re-ask with something smaller and easier to agree to than the original ask — often just the short call itself, not a financial commitment.

This is a framework, not a script — the actual example responses L2i uses are coming in the next lesson.`},
    {title:"[Pending] L2i's Example Responses", content:
`This lesson is waiting on Ayden's real example responses to common objections, so you have specific language to draw from rather than just the general framework.

Once added, treat these the same way as the pitch script — know them well enough to adapt naturally, not recite mechanically.`}
  ],
  quiz:[
    {q:"Which objection family does 'Is this legit?' belong to?", options:["Timing","Trust or skepticism","Amount or capacity","Deflection"], correct:1},
    {q:"What's the first step in the response framework?", options:["Argue back immediately","Acknowledge the objection without arguing","Ignore it and change the subject","Send the contract anyway"], correct:1},
    {q:"What does 'reframe' mean in this framework?", options:["Repeating the same point louder","Addressing what's actually underneath the objection, which is often unstated","Ending the conversation","Asking for a larger commitment"], correct:1},
    {q:"What should the 're-ask' usually be?", options:["A bigger ask than the original one","Something smaller and easier to agree to, like the short call itself","A request for personal financial details","Nothing — there's no need to re-ask"], correct:1},
    {q:"Is the acknowledge-reframe-re-ask sequence a fixed script?", options:["Yes, it must be used word-for-word every time","No, it's a framework — specific example wording is provided separately", "No, objection handling is never needed","Yes, but only for amount objections"], correct:1}
  ]
},
{
  key:"s8_booking", title:"Booking, Logging and Reporting",
  lessons:[
    {title:"What 'Booked' Actually Means", content:
`A booking is a real, scheduled call with a closer, where the prospect has knowingly agreed to discuss investing — not just "they replied" or "they seemed interested."

Don't move a Lead to Booked until there's an actual time on the calendar. Moving someone to Booked too early creates false signal for the whole team, including Ayden's report to Theo.`},
    {title:"Logging It Properly in the CRM", content:
`Create or update the Lead the moment you make contact — not from memory at the end of the day. Fill in their name, organisation or role, source, an estimated value if you have any sense of it, and notes capturing the wealth-qualification signals from the earlier lesson.

Only move the stage to Booked once a call is genuinely scheduled. The moment you do, the CRM automatically notifies Ayden — so accuracy here isn't just good practice, it's what's actually being reported upward.`},
    {title:"How the Report Reaches Ayden and Theo", content:
`Here's exactly what happens mechanically: when you move a Lead to Booked, or a closer marks a Deal Won, the CRM logs a notification. Ayden reviews these in the Report panel and forwards a summary to Theo Johnson, L2i's CEO.

That means Theo is seeing your name attached to your result. Honest, accurate logging isn't bureaucracy — it's the entire reason this system exists, and it's how good work actually gets recognised at the top.`}
  ],
  quiz:[
    {q:"What qualifies as a genuine 'booking'?", options:["Any reply from the prospect","A real, scheduled call with a closer that the prospect has knowingly agreed to","Sending the pitch message","Adding someone to your target list"], correct:1},
    {q:"When should you create or update a Lead in the CRM?", options:["At the end of the week, from memory","The moment you make contact","Only after they invest","Never — closers handle all logging"], correct:1},
    {q:"What happens automatically when a Lead is moved to Booked?", options:["Nothing happens automatically","The CRM notifies Ayden","The prospect is charged a fee","The lead is deleted"], correct:1},
    {q:"Whose name is attached to a booking when Ayden reports to Theo?", options:["No one's — reports are anonymous","The setter who booked it","Only the closer's","Only Ayden's"], correct:1},
    {q:"Why does accurate logging matter so much?", options:["It's just paperwork with no real impact","It's the actual mechanism by which good work gets seen and credited","It only matters for tax purposes","It doesn't matter once the deal is won"], correct:1}
  ]
}
];

const FINAL_KEY = "s9_final";
const FINAL_TITLE = "Final Assessment";
const FINAL_QUIZ = [
  {q:"What is a setter's main job at L2i?", options:["Negotiate final terms","Open and qualify conversations, then book a call with a closer","Manage budgets","Edit the footage"], correct:1},
  {q:"What's the strongest reason most wealthy people actually invest in film?", options:["Guaranteed high returns","Status, legacy, access, or genuine passion","Tax avoidance only","They're forced to by their accountant"], correct:1},
  {q:"What should an opening DM avoid?", options:["Being short","A generic, copy-paste-looking pitch sent to everyone","Mentioning L2i at all","Asking any questions"], correct:1},
  {q:"What is 'outcome independence' in the setter mindset?", options:["Not caring about results at all","Not needing any one specific person to say yes","Working without any targets","Ignoring the CRM"], correct:1},
  {q:"Which is a more reliable wealth signal than a single luxury photo?", options:["High follower count alone","Consistent, ownership-related content over time","Lots of emojis in the bio","A blue verification tick alone"], correct:1},
  {q:"Why are L2i's existing collaborators' followers a good source of prospects?", options:["They're the only people allowed to invest","They carry implicit familiarity and social proof with L2i already","They're guaranteed to say yes","It's faster to message verified accounts only"], correct:1},
  {q:"What should happen before you ever pitch investment to someone?", options:["Nothing — pitch immediately","Confirm genuine interest and real capacity through conversation first","Wait for them to ask about investing","Check their follower count only"], correct:1},
  {q:"What does 'Booked' require?", options:["Any positive reply","A real, scheduled call with a closer", "A signed contract","A deposit payment"], correct:1},
  {q:"What happens automatically when a Lead is moved to Booked?", options:["Nothing","Ayden is notified via the CRM","The prospect is invoiced","The lead is archived"], correct:1},
  {q:"What's the recommended response to a prospect going quiet?", options:["Message repeatedly until they reply","One polite follow-up, then move on","Create a new account to reach them again","Report them to Instagram"], correct:1}
];

const TR_FINAL_KEY = "s9_final";
const TR_FINAL_TITLE = "Final Assessment";

state.training = { loaded:false, view:"home", moduleKey:null, lessonIndex:0, quizAnswers:[], progress:{}, allProgress:[], lastScore:0, lastPassed:false, lastCorrect:0, lastTotal:0 };

function trIsManager(){ return isRole("owner","team_leader","coach"); }
function trModuleByKey(key){ if(key===TR_FINAL_KEY) return {key:TR_FINAL_KEY, title:TR_FINAL_TITLE, lessons:[], quiz:FINAL_QUIZ}; return CURRICULUM.find(m=>m.key===key); }
function trAllKeys(){ return [...CURRICULUM.map(m=>m.key), TR_FINAL_KEY]; }
function trParagraphs(text){ return text.trim().split(/\n\n+/).map(p=>`<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join(""); }

async function loadTrainingData(){
  const { data: progress } = await sb.from("rep_progress").select("*").eq("user_id", state.user.id);
  state.training.progress = {};
  (progress||[]).forEach(p=>{ state.training.progress[p.module_key] = p; });
  if(trIsManager()){
    const { data: allProgress } = await sb.from("rep_progress").select("*");
    state.training.allProgress = allProgress || [];
  }
  state.training.loaded = true;
}

async function renderTrainingHome($main){
  if(!state.training){ state.training = { loaded:false, view:"home", moduleKey:null, lessonIndex:0, quizAnswers:[], progress:{}, allProgress:[], lastScore:0, lastPassed:false, lastCorrect:0, lastTotal:0 }; }
  if(!state.training.loaded){
    $main.innerHTML = `<div class="empty-state">Loading your training…</div>`;
    await loadTrainingData();
  }
  const T = state.training;
  T.view = "home";
  const keys = trAllKeys();
  const passedTotal = keys.filter(k=>T.progress[k] && T.progress[k].passed).length;
  $main.innerHTML = `
    <div class="board-header">
      <h2>Setter Course</h2>
      <div class="spacer"></div>
      ${trIsManager()?`<button class="btn-ghost btn-sm" id="trTeamBtn">Team progress</button>`:""}
    </div>
    <p class="muted" style="font-size:13px;margin-bottom:8px;">Complete each module in order. You need 80% on a module's quiz to unlock the next one.</p>
    <div class="progress-bar-track" style="margin-bottom:18px;"><div class="progress-bar-fill" style="width:${Math.round(passedTotal/keys.length*100)}%;"></div></div>
    ${keys.map((key,i)=>{
      const mod = trModuleByKey(key);
      const prog = T.progress[key];
      const prevKey = keys[i-1];
      const locked = i>0 && !(T.progress[prevKey] && T.progress[prevKey].passed);
      return `
        <div class="module-card ${locked?'locked':''}" ${locked?'':`data-trmod="${key}"`} style="${locked?'':'cursor:pointer;'}">
          <div class="module-num">${String(i+1).padStart(2,"0")}</div>
          <div class="module-info">
            <div class="module-title">${esc(mod.title)}</div>
            <div class="module-status">${locked?"Locked — finish the previous module first":(prog&&prog.passed?`Passed — ${prog.quiz_score}%`:(prog?`Attempted — ${prog.quiz_score}% (retake to pass)`:"Not started"))}</div>
          </div>
          ${prog&&prog.passed?`<span class="pass-badge">PASSED</span>`:""}
        </div>`;
    }).join("")}
  `;
  $main.querySelectorAll("[data-trmod]").forEach(el=>{
    el.addEventListener("click", ()=>{
      T.moduleKey = el.dataset.trmod; T.lessonIndex = 0;
      const mod = trModuleByKey(T.moduleKey);
      if(mod.lessons.length){ renderTrainingLessons($main); }
      else { T.quizAnswers = new Array(mod.quiz.length).fill(null); renderTrainingQuiz($main); }
    });
  });
  if(trIsManager()){ const b = document.getElementById("trTeamBtn"); if(b) b.addEventListener("click", ()=>renderTrainingTeamProgress($main)); }
}

function renderTrainingLessons($main){
  const T = state.training;
  const mod = trModuleByKey(T.moduleKey);
  const lesson = mod.lessons[T.lessonIndex];
  const isPending = lesson.title.indexOf("[Pending]") === 0;
  $main.innerHTML = `
    <a href="#" class="back-link" id="trBack">&larr; Back to course</a>
    <h2 style="margin-bottom:14px;">${esc(mod.title)}</h2>
    <div class="lesson-nav">
      ${mod.lessons.map((l,i)=>`<div class="lesson-dot ${i<T.lessonIndex?'done':''} ${i===T.lessonIndex?'active':''}">${i+1}</div>`).join("")}
    </div>
    <h3 style="font-size:16px;margin-bottom:12px;">${esc(lesson.title)}</h3>
    ${isPending ? `<div class="pending-box">${trParagraphs(lesson.content)}</div>` : `<div class="lesson-content">${trParagraphs(lesson.content)}</div>`}
    <div style="margin-top:20px;display:flex;gap:10px;">
      ${T.lessonIndex>0?`<button class="btn-ghost" id="trPrev">Back</button>`:""}
      <button class="btn-primary" id="trNext">${T.lessonIndex < mod.lessons.length-1 ? "Mark read & continue" : "Continue to quiz"}</button>
    </div>
  `;
  document.getElementById("trBack").addEventListener("click",(e)=>{e.preventDefault();renderTrainingHome($main);});
  const prevBtn = document.getElementById("trPrev");
  if(prevBtn) prevBtn.addEventListener("click", ()=>{ T.lessonIndex--; renderTrainingLessons($main); });
  document.getElementById("trNext").addEventListener("click", ()=>{
    if(T.lessonIndex < mod.lessons.length-1){ T.lessonIndex++; renderTrainingLessons($main); }
    else { T.quizAnswers = new Array(mod.quiz.length).fill(null); renderTrainingQuiz($main); }
  });
}

function renderTrainingQuiz($main){
  const T = state.training;
  const mod = trModuleByKey(T.moduleKey);
  if(!T.quizAnswers || T.quizAnswers.length !== mod.quiz.length) T.quizAnswers = new Array(mod.quiz.length).fill(null);
  $main.innerHTML = `
    <a href="#" class="back-link" id="trBack">&larr; Back to course</a>
    <h2 style="margin-bottom:6px;">${esc(mod.title)} — Quiz</h2>
    <p class="muted" style="font-size:13px;margin-bottom:18px;">You need 80% to pass. ${mod.quiz.length} questions.</p>
    ${mod.quiz.map((q,qi)=>`
      <div class="quiz-q">
        <div class="quiz-q-title">${qi+1}. ${esc(q.q)}</div>
        ${q.options.map((opt,oi)=>`<button class="quiz-opt" data-q="${qi}" data-o="${oi}">${esc(opt)}</button>`).join("")}
      </div>`).join("")}
    <button class="btn-primary" id="trSubmit" style="width:100%;margin-top:6px;" disabled>Submit answers</button>
  `;
  document.getElementById("trBack").addEventListener("click",(e)=>{e.preventDefault();renderTrainingHome($main);});
  $main.querySelectorAll(".quiz-opt").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const qi = Number(btn.dataset.q);
      T.quizAnswers[qi] = Number(btn.dataset.o);
      $main.querySelectorAll(`.quiz-opt[data-q="${qi}"]`).forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      document.getElementById("trSubmit").disabled = !T.quizAnswers.every(a=>a!==null);
    });
  });
  document.getElementById("trSubmit").addEventListener("click", ()=>submitTrainingQuiz($main));
}

async function submitTrainingQuiz($main){
  const T = state.training;
  const mod = trModuleByKey(T.moduleKey);
  let correct = 0;
  mod.quiz.forEach((q,i)=>{ if(T.quizAnswers[i]===q.correct) correct++; });
  const score = Math.round((correct/mod.quiz.length)*100);
  const passed = score >= 80;
  const payload = { user_id: state.user.id, module_key: T.moduleKey, quiz_score: score, passed, updated_at: new Date().toISOString() };
  if(passed) payload.completed_at = new Date().toISOString();
  const { error } = await sb.from("rep_progress").upsert(payload, { onConflict: "user_id,module_key" });
  if(error){ toast(error.message, true); return; }
  T.progress[T.moduleKey] = payload;
  T.lastScore = score; T.lastPassed = passed; T.lastCorrect = correct; T.lastTotal = mod.quiz.length;
  renderTrainingResult($main);
}

function renderTrainingResult($main){
  const T = state.training;
  const mod = trModuleByKey(T.moduleKey);
  $main.innerHTML = `
    <div class="result-card">
      <div class="result-score">${T.lastScore}%</div>
      <div style="font-size:14px;color:${T.lastPassed?'var(--good)':'var(--danger)'};font-weight:600;margin-top:6px;">${T.lastPassed?"PASSED":"NOT YET — 80% NEEDED"}</div>
      <div class="muted" style="margin-top:10px;font-size:13px;">${esc(state.profile.full_name)} · ${esc(mod.title)}</div>
      <div class="muted" style="font-size:12px;">${T.lastCorrect}/${T.lastTotal} correct · ${new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}</div>
      <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        ${!T.lastPassed?`<button class="btn-ghost" id="trRetake">Retake quiz</button>`:""}
        <button class="btn-primary" id="trHome">${T.lastPassed?"Continue":"Back to course"}</button>
      </div>
    </div>
  `;
  const retake = document.getElementById("trRetake");
  if(retake) retake.addEventListener("click", ()=>{ T.quizAnswers=null; renderTrainingQuiz($main); });
  document.getElementById("trHome").addEventListener("click", ()=>renderTrainingHome($main));
}

function renderTrainingTeamProgress($main){
  const T = state.training;
  const keys = trAllKeys();
  $main.innerHTML = `
    <a href="#" class="back-link" id="trBack">&larr; Back to course</a>
    <h2 style="margin-bottom:14px;">Team Progress</h2>
    <div style="overflow-x:auto;">
    <table>
      <tr><th>Rep</th><th>Role</th><th>Passed</th><th>Latest</th></tr>
      ${state.allProfiles.map(p=>{
        const rows = T.allProgress.filter(r=>r.user_id===p.id);
        const passedCount = rows.filter(r=>r.passed).length;
        const latest = rows.slice().sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at))[0];
        return `<tr><td>${esc(p.full_name)}</td><td>${esc(p.role.replace(/_/g," "))}</td><td>${passedCount}/${keys.length}</td><td>${latest?esc(latest.module_key)+" — "+latest.quiz_score+"%":"—"}</td></tr>`;
      }).join("")}
    </table>
    </div>
  `;
  document.getElementById("trBack").addEventListener("click",(e)=>{e.preventDefault();renderTrainingHome($main);});
}

init();
</script>
